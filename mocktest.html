<style>
/* GATE Exam-style Layout */
.exam-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    min-height: calc(100vh - 64px);
}
.exam-main { padding: 20px 24px; overflow-y: auto; }
.exam-sidebar {
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc(100vh - 64px);
}
@media (max-width: 900px) {
    .exam-layout { grid-template-columns: 1fr; }
    .exam-sidebar {
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 240px;
    }
    .exam-sidebar .palette-grid { grid-template-columns: repeat(10, 1fr); }
}

/* ============ Floating Calculator (always accessible) ============ */
.floating-calc {
    position: fixed;
    bottom: 80px;
    right: 24px;
    z-index: 1000;
    width: 280px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    transform: translateY(20px) scale(0.95);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s var(--ease-out), opacity 0.2s;
}
.floating-calc.visible {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
}
.floating-calc-header {
    background: var(--grad-brand);
    color: white;
    padding: 10px 14px;
    border-radius: 14px 14px 0 0;
    font-size: 0.82rem;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    user-select: none;
}
.floating-calc-close {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
}
.floating-calc-close:hover { background: rgba(255, 255, 255, 0.35); }
.floating-calc-body { padding: 10px; }
.floating-calc .side-calc-display {
    background: #0f172a;
    color: #4ade80;
    padding: 12px 14px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    text-align: right;
    font-size: 1.3rem;
    min-height: 44px;
    margin-bottom: 8px;
    word-break: break-all;
    font-weight: 700;
}
.floating-calc .side-calc-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
}
.floating-calc .calc-key {
    padding: 10px 2px;
    border: none;
    border-radius: 6px;
    background: var(--bg-light);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
    font-family: inherit;
}
.floating-calc .calc-key:hover { background: var(--primary); color: white; }
.floating-calc .calc-key:active { transform: scale(0.94); }
.floating-calc .calc-key.op { background: rgba(102, 126, 234, 0.12); color: var(--primary); }
.floating-calc .calc-key.eq { background: var(--grad-brand); color: white; grid-column: span 2; }
.floating-calc .calc-key.clear { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
@media (max-width: 600px) {
    .floating-calc {
        width: calc(100vw - 32px);
        right: 16px;
        bottom: 90px;
    }
}

/* Exam Timer Bar */
.exam-timer-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--grad-brand);
    color: white;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    transition: background 0.3s;
}
.exam-timer-bar.warning { background: var(--grad-orange); }
.exam-timer-bar.danger { background: var(--grad-red); animation: pulse 0.5s infinite; }
.exam-timer-time {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}
.exam-timer-label { font-size: 0.78rem; opacity: 0.85; }
.exam-timer-actions { display: flex; gap: 8px; }
.exam-timer-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.82rem;
    font-family: inherit;
    transition: background 0.2s;
}
.exam-timer-btn:hover { background: rgba(255,255,255,0.3); }
.exam-timer-btn.submit { background: rgba(239,68,68,0.8); }
.exam-timer-btn.submit:hover { background: rgba(239,68,68,1); }

/* Question Palette */
.palette-header {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
}
.palette-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
}
.palette-cell {
    aspect-ratio: 1;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-card);
    color: var(--text-2);
}
.palette-cell:hover { border-color: var(--primary); transform: scale(1.08); }
.palette-cell.answered { background: var(--correct); color: white; border-color: transparent; }
.palette-cell.not-answered { background: var(--danger); color: white; border-color: transparent; }
.palette-cell.marked { background: var(--warning); color: white; border-color: transparent; }
.palette-cell.answered-marked { background: var(--purple); color: white; border-color: transparent; }
.palette-cell.current { box-shadow: 0 0 0 2px var(--primary); }

.palette-legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 8px;
}
.palette-legend-item { display: flex; align-items: center; gap: 4px; }
.palette-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* Side Calculator */
.side-calc {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
}
.side-calc-header {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.side-calc-toggle {
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 600;
}
.side-calc-display {
    background: #1a1a2e;
    color: #00ff88;
    padding: 8px 10px;
    border-radius: 6px;
    font-family: 'Courier New', monospace;
    text-align: right;
    font-size: 1.1rem;
    min-height: 36px;
    margin-bottom: 6px;
    word-break: break-all;
}
.side-calc-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
}
.calc-key {
    padding: 7px 2px;
    border: none;
    border-radius: 4px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    font-family: inherit;
}
.calc-key:hover { background: var(--primary); color: white; }
.calc-key:active { transform: scale(0.92); }
.calc-key.op { background: var(--bg-light); color: var(--primary); }
.calc-key.eq { background: var(--grad-brand); color: white; }
.calc-key.clear { background: var(--danger-bg); color: var(--danger); }
.side-calc.collapsed .side-calc-display,
.side-calc.collapsed .side-calc-buttons { display: none; }

/* Question Card (Exam Style) */
.exam-question-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
}
.exam-q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.exam-q-number {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
}
.exam-q-type {
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
}
.exam-q-marks {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 600;
}
.exam-q-subject {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-left: auto;
}
.exam-q-content {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 16px;
}
.exam-options { display: flex; flex-direction: column; gap: 8px; }
.exam-option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg-card);
}
.exam-option:hover { border-color: var(--primary); background: rgba(102,126,234,0.04); }
.exam-option.selected { border-color: var(--primary); background: rgba(102,126,234,0.08); }
.exam-option-radio {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
}
.exam-option.selected .exam-option-radio {
    border-color: var(--primary);
    background: var(--primary);
    box-shadow: inset 0 0 0 3px white;
}
.exam-option-checkbox {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
}
.exam-option.selected .exam-option-checkbox {
    border-color: var(--primary);
    background: var(--primary);
}
.exam-option-content { flex: 1; min-width: 0; }
.exam-nat-input {
    width: 200px;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--bg-card);
    color: var(--text);
}
.exam-nat-input:focus { outline: none; border-color: var(--primary); }

/* Exam Navigation */
.exam-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    flex-wrap: wrap;
    gap: 8px;
}
.exam-nav-btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-card);
    color: var(--text);
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.exam-nav-btn:hover { border-color: var(--primary); color: var(--primary); }
.exam-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.exam-nav-btn.primary { background: var(--grad-brand); color: white; border-color: transparent; }
.exam-nav-btn.mark { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

/* Setup Screen */
.setup-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    max-width: 700px;
    margin: 20px auto;
    box-shadow: var(--shadow);
}
.setup-title { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.setup-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; }
.setup-pattern {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}
.setup-pattern-card {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}
.setup-pattern-value { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
.setup-pattern-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
.setup-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.setup-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
.setup-field select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.88rem; font-family: inherit; background: var(--bg-card); color: var(--text); }

/* Results */
.result-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    text-align: center;
    max-width: 700px;
    margin: 20px auto;
    box-shadow: var(--shadow);
}
.result-score {
    font-size: 3.5rem;
    font-weight: 900;
    background: var(--grad-brand);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin: 10px 0;
}
.result-grade {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
}
.result-stats {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 16px 0;
    font-size: 0.9rem;
}
.result-subject-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 0.82rem;
}
.result-subject-table th, .result-subject-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
}
.result-subject-table th { background: var(--grad-brand); color: white; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; }
</style>

<script>
const TIME_LIMIT = 3 * 60 * 60;
const TOTAL_QUESTIONS = 65;
const TOTAL_MARKS = 100;

// Subject weightage for question selection (based on GATE CSE pattern)
const SUBJECT_WEIGHTS = {
    'algorithms': 12, 'data-structures': 12, 'discrete-mathematics': 15,
    'operating-systems': 10, 'database-management-system': 10,
    'computer-networks': 8, 'theory-of-computation': 7,
    'compiler-design': 5, 'digital-logic': 5, 'computer-organization': 8,
    'programming-languages': 5, 'general-aptitude': 15,
    'software-engineering': 3, 'web-technologies': 2,
};

    phase: 'setup',
    questions: [],
    answers: {},

    visited: new Set(),
    currentQ: 0,
    timeLeft: TIME_LIMIT,
    startTime: null,
    timerInterval: null,
    calcVisible: false,
    calcExpr: '',
    calcDisplay: '0',
};

function init() { renderSetup(); }

// ============ Setup Screen ============

                                <tr style="background:rgba(16,185,129,0.05);"><td>Algorithms</td><td><strong>7</strong></td><td>5</td></tr>
                                <tr style="background:rgba(16,185,129,0.05);"><td>Databases</td><td><strong>7</strong></td><td>5</td></tr>

                                <tr style="background:rgba(16,185,129,0.05);"><td>Theory of Computation</td><td><strong>6</strong></td><td>4</td></tr>
                                <tr style="background:rgba(16,185,129,0.05);"><td>Compiler Design</td><td><strong>4</strong></td><td>3</td></tr>
                                <tr style="background:var(--bg-light);"><td colspan="2"><strong>TOTAL</strong></td><td><strong>100</strong></td><td><strong>65</strong></td></tr>

                    <table class="cutoff-table" style="margin-bottom:20px;">

// ============ Question Selection Algorithm (v3 — uses GATE Engine) ============
function selectQuestions(source) {
    // PREFER the new GATE Intelligent Engine v3
    if (typeof window.SOH_QEngine !== 'undefined' && window.SOH_QEngine.GATE_PATTERN) {
        try {
            const questions = window.SOH_QEngine.buildMockTest(source, {
                totalQuestions: TOTAL_QUESTIONS,
                totalMarks: TOTAL_MARKS,
                adaptive: true,
                avoidRecent: true,
            });
            if (questions.length > 0) {
                // Log paper stats for transparency
                const stats = window.SOH_QEngine.computePaperStats(questions);
                console.log('🎯 GATE v3 Paper Generated:', stats);
                return questions;
            }
        } catch (e) {
            console.warn('GATE Engine failed, falling back to v2:', e);
        }
    }

    // Fallback to v2 engine
    if (typeof window.SOH_QEngine !== 'undefined') {
        const questions = window.SOH_QEngine.buildMockTest(source, {
            totalQuestions: TOTAL_QUESTIONS,
            totalMarks: TOTAL_MARKS,
            subjectWeights: SUBJECT_WEIGHTS,
        });
        if (questions.length > 0) return questions;
    }

    if (typeof window.GATE_DATA === 'undefined') return [];

    // === LEGACY FALLBACK (v1) ===
    // Collect all questions grouped by subject
    const bySubject = {};
    const seenIds = new Set(); // Deduplication
    for (const subj of window.GATE_DATA.subjects) {
        for (const chap of subj.chapters) {
            for (const q of chap.questions) {
                if (source === 'recent' && q.year < 2021) continue;
                if (source === '2025' && q.year !== 2025) continue;
                if (source === '2024' && q.year !== 2024) continue;
                if (source === '2023' && q.year !== 2023) continue;
                if (seenIds.has(q.question_id)) continue; // Skip duplicates
                seenIds.add(q.question_id);

                if (!bySubject[q.subject]) bySubject[q.subject] = [];
                bySubject[q.subject].push(q);
            }
        }
    }

    // Calculate how many questions to pick from each subject based on weightage
    const selected = [];
    const selectedIds = new Set();
    let totalWeight = 0;
    for (const [subj, weight] of Object.entries(SUBJECT_WEIGHTS)) {
        if (bySubject[subj] && bySubject[subj].length > 0) totalWeight += weight;
    }

    for (const [subj, weight] of Object.entries(SUBJECT_WEIGHTS)) {
        if (!bySubject[subj] || bySubject[subj].length === 0) continue;
        const targetCount = Math.round((weight / totalWeight) * TOTAL_QUESTIONS);

        // Proper Fisher-Yates shuffle
        const shuffled = [...bySubject[subj]];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const picked = shuffled.slice(0, Math.min(targetCount, shuffled.length));
        for (const q of picked) {
            if (!selectedIds.has(q.question_id)) {
                selected.push(q);
                selectedIds.add(q.question_id);
            }
        }
    }

    // If we have too few, fill randomly from remaining
    if (selected.length < TOTAL_QUESTIONS) {
        const allRemaining = [];
        for (const qs of Object.values(bySubject)) {
            for (const q of qs) {
                if (!selectedIds.has(q.question_id)) allRemaining.push(q);
            }
        }
        // Fisher-Yates shuffle
        for (let i = allRemaining.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allRemaining[i], allRemaining[j]] = [allRemaining[j], allRemaining[i]];
        }
        for (const q of allRemaining) {
            if (selected.length >= TOTAL_QUESTIONS) break;
            if (!selectedIds.has(q.question_id)) {
                selected.push(q);
                selectedIds.add(q.question_id);
            }
        }
    }

    // If too many, trim. Then Fisher-Yates final shuffle.
    const final = selected.slice(0, TOTAL_QUESTIONS);
    for (let i = final.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [final[i], final[j]] = [final[j], final[i]];
    }
    return final;
}

// ============ Start Test ============
function startMockTest() {
    const source = document.getElementById('mockSource').value;
    const duration = parseInt(document.getElementById('mockDuration').value);
    mockState.timeLeft = duration;
    mockState.startTime = Date.now();

    mockState.questions = selectQuestions(source);
    if (mockState.questions.length < 10) {
        alert('Not enough questions in selected source. Try "Mixed".');
        return;
    }

    mockState.answers = {};
    mockState.marked = new Set();
    mockState.visited = new Set([0]);
    mockState.currentQ = 0;
    mockState.phase = 'active';
    mockState.timerInterval = setInterval(tickTimer, 1000);
    renderExam();
}

// ============ Timer ============
function tickTimer() {
    mockState.timeLeft--;
    updateTimer();
    if (mockState.timeLeft <= 0) submitMockTest();
}

function updateTimer() {
    const bar = document.getElementById('timerBar');
    if (!bar) return;
    const h = Math.floor(mockState.timeLeft / 3600);
    const m = Math.floor((mockState.timeLeft % 3600) / 60);
    const s = mockState.timeLeft % 60;
    const timeEl = document.getElementById('timerTime');
    if (timeEl) timeEl.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    bar.classList.remove('warning', 'danger');
    if (mockState.timeLeft < 300) bar.classList.add('danger');
    else if (mockState.timeLeft < 600) bar.classList.add('warning');
}

function makeCalcDraggable(calc) {
    const handle = document.getElementById('calcDragHandle');
    if (!handle) return;
    let isDragging = false;
    let startX, startY, startLeft, startTop;

    handle.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('floating-calc-close')) return;
        isDragging = true;
        const rect = calc.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        calc.style.transition = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const newLeft = Math.max(0, Math.min(window.innerWidth - calc.offsetWidth, startLeft + dx));
        const newTop = Math.max(0, Math.min(window.innerHeight - calc.offsetHeight, startTop + dy));
        calc.style.left = newLeft + 'px';
        calc.style.top = newTop + 'px';
        calc.style.right = 'auto';
        calc.style.bottom = 'auto';
    });

    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            calc.style.transition = '';
        }
    });

    // Touch support
    handle.addEventListener('touchstart', (e) => {
        if (e.target.classList.contains('floating-calc-close')) return;
        isDragging = true;
        const rect = calc.getBoundingClientRect();
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startLeft = rect.left;
        startTop = rect.top;
        calc.style.transition = 'none';
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        const newLeft = Math.max(0, Math.min(window.innerWidth - calc.offsetWidth, startLeft + dx));
        const newTop = Math.max(0, Math.min(window.innerHeight - calc.offsetHeight, startTop + dy));
        calc.style.left = newLeft + 'px';
        calc.style.top = newTop + 'px';
        calc.style.right = 'auto';
        calc.style.bottom = 'auto';
    }, { passive: true });

    document.addEventListener('touchend', () => {
        if (isDragging) {
            isDragging = false;
            calc.style.transition = '';
        }
    });
}

// ============ Side Calculator ============
function toggleCalc() {
    mockState.calcVisible = !mockState.calcVisible;
    const calc = document.getElementById('floatingCalc');
    if (calc) {
        if (mockState.calcVisible) {
            calc.classList.add('visible');
        } else {
            calc.classList.remove('visible');
        }
    }
    // Update button text if visible
    const btns = document.querySelectorAll('.exam-timer-btn');
    btns.forEach(b => {
        if (b.textContent.includes('Calculator')) {
            b.textContent = mockState.calcVisible ? '🧮 Hide Calc' : '🧮 Calculator';
        }
    });
}

function calcInput(val) {
    if (mockState.calcDisplay === '0' && val !== '.') {
        mockState.calcDisplay = val;
        mockState.calcExpr = val;
    } else {
        mockState.calcDisplay += val;
        mockState.calcExpr += val;
    }
    updateCalcDisplay();
}

function calcClear() { mockState.calcDisplay = '0'; mockState.calcExpr = ''; updateCalcDisplay(); }

function calcBackspace() {
    if (mockState.calcDisplay.length > 1) {
        mockState.calcDisplay = mockState.calcDisplay.slice(0, -1);
        mockState.calcExpr = mockState.calcExpr.slice(0, -1);
    } else {
        mockState.calcDisplay = '0'; mockState.calcExpr = '';
    }
    updateCalcDisplay();
}

function calcFn(fn) {
    try {
        const val = parseFloat(mockState.calcDisplay);
        let result;
        if (fn === 'sqrt') result = Math.sqrt(val);
        else if (fn === 'ln') result = Math.log(val);
        else if (fn === 'log') result = Math.log10(val);
        else if (fn === 'pow') result = Math.pow(val, 2);
        mockState.calcDisplay = String(parseFloat(result.toPrecision(12)));
        mockState.calcExpr = mockState.calcDisplay;
        updateCalcDisplay();
    } catch {}
}

function calcEquals() {
    try {
        const result = eval(mockState.calcExpr);
        mockState.calcDisplay = String(parseFloat(result.toPrecision(12)));
        mockState.calcExpr = mockState.calcDisplay;
        updateCalcDisplay();
    } catch { mockState.calcDisplay = 'Error'; updateCalcDisplay(); }
}

function updateCalcDisplay() {
    const el = document.getElementById('calcDisplay');
    if (el) el.textContent = mockState.calcDisplay;
}

// ============ Answer Management ============
function selectAnswer(identifier, isMSQ) {
    if (isMSQ) {
        if (!Array.isArray(mockState.answers[mockState.currentQ])) mockState.answers[mockState.currentQ] = [];
        const arr = mockState.answers[mockState.currentQ];
        if (arr.includes(identifier)) arr.splice(arr.indexOf(identifier), 1);
        else arr.push(identifier);
    } else {
        mockState.answers[mockState.currentQ] = identifier;
    }
    // Update only the option visuals (not full re-render)
    updateOptionSelection();
    updatePaletteCell(mockState.currentQ);
}

function setNatAnswer(val) {
    mockState.answers[mockState.currentQ] = val.trim();
    // Don't re-render on every keystroke — just update palette
    updatePaletteCell(mockState.currentQ);
}

function clearAnswer() {
    delete mockState.answers[mockState.currentQ];
    // Update options and palette without full re-render
    updateOptionSelection();
    updatePaletteCell(mockState.currentQ);
}

function toggleMark() {
    if (mockState.marked.has(mockState.currentQ)) mockState.marked.delete(mockState.currentQ);
    else mockState.marked.add(mockState.currentQ);
    // Only update palette cell + mark button, not full re-render
    updatePaletteCell(mockState.currentQ);
    updateMarkButton();
}

function goTo(idx) {
    if (idx < 0 || idx >= mockState.questions.length) return;
    // Update previous palette cell (remove current highlight)
    const prevCell = document.querySelector('.palette-cell.current');
    if (prevCell) prevCell.classList.remove('current');
    mockState.currentQ = idx;
    mockState.visited.add(idx);
    // Full re-render only when changing question (necessary to show new Q)
    renderExam();
    const main = document.querySelector('.exam-main');
    if (main) main.scrollTop = 0;
}

// ============ Lightweight DOM updates (avoid full re-render) ============
function updateOptionSelection() {
    const userAns = mockState.answers[mockState.currentQ];
    const isMSQ = mockState.questions[mockState.currentQ].normalized_type === 'msq';
    document.querySelectorAll('.exam-option').forEach(opt => {
        const identifier = opt.dataset.identifier;
        if (!identifier) return;
        const isSelected = isMSQ
            ? (Array.isArray(userAns) && userAns.includes(identifier))
            : (userAns === identifier);
        opt.classList.toggle('selected', isSelected);
    });
}

function updatePaletteCell(idx) {
    const cells = document.querySelectorAll('.palette-cell');
    const cell = cells[idx];
    if (!cell) return;
    const answered = mockState.answers[idx] !== undefined && mockState.answers[idx] !== '';
    const marked = mockState.marked.has(idx);
    cell.classList.remove('answered', 'marked', 'answered-marked', 'not-answered');
    if (answered && marked) cell.classList.add('answered-marked');
    else if (answered) cell.classList.add('answered');
    else if (marked) cell.classList.add('marked');
    else if (mockState.visited.has(idx)) cell.classList.add('not-answered');

    // Update legend count
    const legend = document.querySelector('.palette-legend');
    if (legend) {
        const answeredCount = Object.keys(mockState.answers).filter(k => mockState.answers[k] !== undefined && mockState.answers[k] !== '').length;
        const answeredItem = legend.children[0];
        if (answeredItem) answeredItem.innerHTML = `<div class="palette-legend-dot" style="background:var(--correct);"></div>Answered (${answeredCount})`;
        const markedItem = legend.children[2];
        if (markedItem) markedItem.innerHTML = `<div class="palette-legend-dot" style="background:var(--warning);"></div>Marked (${mockState.marked.size})`;
    }

    // Update submit button answer count
    const submitBtn = document.querySelector('.exam-timer-btn.submit');
    if (submitBtn) {
        const answeredCount = Object.keys(mockState.answers).filter(k => mockState.answers[k] !== undefined && mockState.answers[k] !== '').length;
        submitBtn.onclick = () => {
            if (confirm(`Submit test? You have answered ${answeredCount} of ${mockState.questions.length} questions.`)) submitMockTest();
        };
    }
}

function updateMarkButton() {
    const markBtn = document.querySelector('[onclick="toggleMark()"]');
    if (markBtn) {
        const isMarked = mockState.marked.has(mockState.currentQ);
        markBtn.textContent = isMarked ? '🔖 Unmark' : '🔖 Mark for Review';
    }
}

function goToNext() {
    if (mockState.currentQ < mockState.questions.length - 1) goTo(mockState.currentQ + 1);
}

// ============ Submit & Results ============
function submitMockTest() {
    clearInterval(mockState.timerInterval);
    mockState.phase = 'results';

    let score = 0, correct = 0, wrong = 0, unattempted = 0;
    const subjectBreakdown = {};

    mockState.questions.forEach((q, i) => {
        const userAns = mockState.answers[i];
        const subj = q.subject || 'unknown';
        if (!subjectBreakdown[subj]) subjectBreakdown[subj] = { correct: 0, wrong: 0, unattempted: 0, total: 0, score: 0 };
        subjectBreakdown[subj].total++;

        if (userAns === undefined || userAns === '' || (Array.isArray(userAns) && userAns.length === 0)) {
            unattempted++; subjectBreakdown[subj].unattempted++; return;
        }

        let isCorrect = false;
        if (q.normalized_type === 'nat') {
            if (q.answer) {
                const rm = q.answer.match(/^(-?\d+(?:\.\d+)?)\s*to\s*(-?\d+(?:\.\d+)?)$/);
                if (rm) { const v = parseFloat(userAns); isCorrect = v >= parseFloat(rm[1])-0.01 && v <= parseFloat(rm[2])+0.01; }
                else { const e = parseFloat(q.answer); const a = parseFloat(userAns); if (!isNaN(e)&&!isNaN(a)) isCorrect = Math.abs(e-a)<0.01; }
            }
        } else if (q.normalized_type === 'msq') {
            const us = new Set(Array.isArray(userAns)?userAns:[]); const cs = new Set(q.correct_options||[]);
            isCorrect = us.size === cs.size && [...us].every(x => cs.has(x));
        } else {
            isCorrect = userAns === (q.correct_options && q.correct_options[0]);
        }

        if (isCorrect) { score += q.marks; correct++; subjectBreakdown[subj].correct++; subjectBreakdown[subj].score += q.marks; }
        else {
            if (q.normalized_type === 'mcq' || q.normalized_type === 'true_false') score -= q.marks === 1 ? 1/3 : 2/3;
            wrong++; subjectBreakdown[subj].wrong++;
            if (typeof window.addToErrorNotebook === 'function') window.addToErrorNotebook(q);
        }
    });

    // Log to tracker
    const duration = mockState.startTime ? Math.floor((Date.now() - mockState.startTime) / 1000) : 0;
    if (typeof window.logQuizResult === 'function') {
        window.logQuizResult({ source: 'mocktest', total: mockState.questions.length, correct, wrong, unattempted, score: parseFloat(score.toFixed(2)), max_score: TOTAL_MARKS, duration_sec: duration, subject_breakdown: subjectBreakdown });
    }
    mockState.questions.forEach((q, i) => {
        const ua = mockState.answers[i];
        if (ua === undefined || ua === '' || (Array.isArray(ua) && ua.length === 0)) return;
        let ic = false;
        if (q.normalized_type === 'nat') { if (q.answer) { const rm = q.answer.match(/^(-?\d+(?:\.\d+)?)\s*to\s*(-?\d+(?:\.\d+)?)$/); if (rm) { const v=parseFloat(ua); ic = v>=parseFloat(rm[1])-0.01 && v<=parseFloat(rm[2])+0.01; } else { const e=parseFloat(q.answer); const a=parseFloat(ua); if(!isNaN(e)&&!isNaN(a)) ic=Math.abs(e-a)<0.01; } } }
        else if (q.normalized_type === 'msq') { const us=new Set(Array.isArray(ua)?ua:[]); const cs=new Set(q.correct_options||[]); ic=us.size===cs.size&&[...us].every(x=>cs.has(x)); }
        else ic = ua === (q.correct_options&&q.correct_options[0]);
        if (typeof window.logAttempt === 'function') window.logAttempt({ source:'mocktest', subject:q.subject, chapter:q.chapter, question_id:q.question_id, type:q.normalized_type, correct:ic });
    });

    // Award XP via gamification
    if (window.SOH_Game) window.SOH_Game.onMockComplete(score, TOTAL_MARKS);

    renderResults(score, correct, wrong, unattempted, subjectBreakdown, duration);
}

function renderResults(score, correct, wrong, unattempted, subjectBreakdown, duration) {
    const pct = (score / TOTAL_MARKS) * 100;
    let grade, gradeClass;
    if (pct >= 80) { grade = '🏆 Excellent'; gradeClass = 'grade-excellent'; if (typeof window.fireConfetti === 'function') window.fireConfetti(4000); }
    else if (pct >= 60) { grade = '✅ Good'; gradeClass = 'grade-good'; if (typeof window.fireConfetti === 'function') window.fireConfetti(3000); }
    else if (pct >= 40) { grade = '📈 Average'; gradeClass = 'grade-average'; }
    else { grade = '💪 Needs Work'; gradeClass = 'grade-poor'; }

    const hrs = Math.floor(duration / 3600); const mins = Math.floor((duration % 3600) / 60);
    const subjIcons = {'algorithms':'⚡','data-structures':'🌳','discrete-mathematics':'∑','operating-systems':'⚙️','database-management-system':'🗄️','computer-networks':'🌐','theory-of-computation':'🔤','compiler-design':'🔧','digital-logic':'🔌','computer-organization':'💻','programming-languages':'👨‍💻','general-aptitude':'🧮'};

    document.getElementById('appRoot').innerHTML = `
        <div class="app-content">
            <div class="app-content-scroll" style="max-width:800px;margin:0 auto;">
                <div class="result-card">
                    <div style="font-size:3rem;margin-bottom:8px;">${pct >= 60 ? '🎉' : '📚'}</div>
                    <h1 style="font-size:1.5rem;font-weight:800;color:var(--text);margin-bottom:8px;">Mock Test Complete!</h1>
                    <div class="result-score">${score.toFixed(2)} / ${TOTAL_MARKS}</div>
                    <div class="result-grade ${gradeClass}">${grade} • ${pct.toFixed(1)}%</div>
                    <div class="result-stats">
                        <div>✅ <strong>${correct}</strong> correct</div>
                        <div>❌ <strong>${wrong}</strong> wrong</div>
                        <div>⏭️ <strong>${unattempted}</strong> skipped</div>
                        <div>⏱️ <strong>${hrs}h ${mins}m</strong></div>
                    </div>
                    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
                        <button class="btn btn-primary btn-sm" onclick="init()">🔄 New Test</button>
                        <a href="./progress.html" class="btn btn-ghost btn-sm">📊 View Progress</a>
                        <a href="./flashcards.html" class="btn btn-ghost btn-sm">🎴 Review Errors</a>
                    </div>
                </div>

                <div class="setup-card" style="margin-top:16px;">
                    <h3 style="font-size:1rem;margin-bottom:12px;">📊 Subject-wise Breakdown</h3>
                    <table class="result-subject-table">
                        <thead><tr><th>Subject</th><th>Total</th><th>✅</th><th>❌</th><th>⏭️</th><th>Score</th><th>Accuracy</th></tr></thead>
                        <tbody>
                            ${Object.entries(subjectBreakdown).sort((a,b) => b[1].total - a[1].total).map(([subj, s]) => {
                                const acc = s.correct + s.wrong > 0 ? Math.round((s.correct / (s.correct + s.wrong)) * 100) : 0;
                                const accColor = acc >= 60 ? '#10b981' : (acc >= 40 ? '#f59e0b' : '#ef4444');
                                return `<tr>
                                    <td><strong>${subjIcons[subj] || '📖'} ${subj.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</strong></td>
                                    <td>${s.total}</td>
                                    <td style="color:#10b981;">${s.correct}</td>
                                    <td style="color:#ef4444;">${s.wrong}</td>
                                    <td>${s.unattempted}</td>
                                    <td>${s.score.toFixed(2)}</td>
                                    <td style="color:${accColor};font-weight:700;">${s.correct + s.wrong > 0 ? acc + '%' : '—'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>

                <div style="background:linear-gradient(135deg,rgba(102,126,234,0.06),rgba(118,75,162,0.06));border-radius:14px;padding:16px;margin:16px 0;font-size:0.85rem;color:var(--text-muted);text-align:center;">
                    💡 <strong>Wrong answers added to Error Notebook.</strong> Review at <a href="./flashcards.html" style="color:var(--primary);">Flashcards</a> → Error Notebook with SM-2 spaced repetition.
                </div>

                <!-- AI Weak Area Drilling -->
                <div class="setup-card" style="margin-top:16px;">
                    <h3 style="font-size:1rem;margin-bottom:8px;">🤖 AI Practice for Weak Areas</h3>
                    <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px;">Subjects below 60% accuracy need more practice. Let AI generate similar questions.</p>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        ${Object.entries(subjectBreakdown).filter(([_, s]) => s.correct + s.wrong > 0 && (s.correct / (s.correct + s.wrong)) * 100 < 60).map(([subj, s]) => {
                            const label = subj.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
                            return `<button class="btn btn-ghost btn-sm" onclick="drillWeak('${subj}','${label}')">🤖 ${subjIcons[subj] || '📖'} ${label} (${Math.round((s.correct/(s.correct+s.wrong))*100)}%)</button>`;
                        }).join('')}
                        ${Object.entries(subjectBreakdown).filter(([_, s]) => s.correct + s.wrong > 0 && (s.correct / (s.correct + s.wrong)) * 100 < 60).length === 0 ? '<p style="color:var(--correct);">🎉 No weak areas — great job!</p>' : ''}
                    </div>
                </div>
            </div>
        </div>
    `;
    renderMath();
}

function drillWeak(subject, label) {
    if (typeof window.SOH_AI !== 'undefined') {
        window.SOH_AI.open();
        window.SOH_AI.setMode('quiz');
        setTimeout(() => {
            const input = document.getElementById('aiChatInput');
            if (input) {
                input.value = `Generate 5 GATE CSE practice questions on ${label}. My mock test accuracy is below 60% in this area. Mix MCQ and NAT types. Include answers and explanations.`;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }, 300);
        if (window.showToast) window.showToast('🤖 AI generating questions for ' + label, 'info', 3000);
    }
}

// ============ Utils ============
function sanitize(html) { if (!html) return ''; return DOMPurify.sanitize(html, { ADD_TAGS: ['sup','sub','u','s'], ADD_ATTR: ['target'] }); }
function typeLabel(t) { return { mcq:'MCQ', msq:'MSQ', nat:'NAT', subjective:'Subjective', fill_blanks:'Fill', true_false:'T/F' }[t] || t; }

function renderMath() {
    if (typeof renderMathInElement === 'function') {
        document.querySelectorAll('.q-content').forEach(el => { try { renderMathInElement(el, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError: false }); } catch{} });
    } else { setTimeout(renderMath, 150); }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (mockState.phase !== 'active') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goToNext(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(mockState.currentQ - 1); }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMark(); }
});

init();
</script>
<script src="./theme.js"></script>
</body>
</html>
