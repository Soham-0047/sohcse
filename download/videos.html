<style>
/* Video-specific styles */
.video-search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}
.video-search-bar input {
    flex: 1;
    padding: 12px 18px;
    border: 2px solid var(--border);
    border-radius: var(--r-full);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg-card);
    color: var(--text);
    transition: all 0.2s;
}
.video-search-bar input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
}
.video-search-bar button {
    padding: 12px 24px;
    border: none;
    border-radius: var(--r-full);
    background: var(--grad-brand);
    color: white;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s var(--ease-out);
    white-space: nowrap;
}
.video-search-bar button:hover { transform: translateY(-2px); box-shadow: var(--shadow-brand); }

.tab-bar {
    display: flex;
    gap: 4px;
    background: var(--bg-light);
    border-radius: var(--r);
    padding: 4px;
    margin-bottom: 18px;
    overflow-x: auto;
    scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border: none;
    background: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}
.tab-btn:hover { color: var(--primary); }
.tab-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); }

.search-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}
.search-result-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    transition: all 0.3s var(--ease-out);
    display: flex;
    flex-direction: column;
}
.search-result-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--primary); }
.search-result-thumb {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--grad-brand);
    cursor: pointer;
    overflow: hidden;
}
.search-result-thumb img { width: 100%; height: 100%; object-fit: cover; }
.search-result-thumb .duration-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
}
.search-result-thumb .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s;
}
.search-result-card:hover .play-overlay { opacity: 1; }
.search-result-thumb .play-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    padding-left: 3px;
}
.search-result-info { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; }
.search-result-title { font-weight: 700; font-size: 0.88rem; color: var(--text); margin-bottom: 4px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.search-result-channel { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
.search-result-meta { font-size: 0.72rem; color: var(--text-light); margin-bottom: 8px; }
.search-result-actions { display: flex; gap: 6px; margin-top: auto; }
.search-result-actions button {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-2);
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 3px;
}
.search-result-actions button:hover { border-color: var(--primary); color: var(--primary); }
.search-result-actions button.added { background: var(--correct); color: white; border-color: var(--correct); }

.playlist-selector {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px;
    margin-bottom: 14px;
}
.playlist-selector select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 0.85rem;
    font-family: inherit;
    background: var(--bg-light);
    color: var(--text);
}
.playlist-selector-actions { display: flex; gap: 6px; margin-top: 8px; }
.playlist-selector-actions input {
    flex: 1;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 0.82rem;
    font-family: inherit;
    background: var(--bg-light);
    color: var(--text);
}
.playlist-selector-actions button {
    padding: 7px 14px;
    border: none;
    border-radius: var(--r-sm);
    background: var(--grad-brand);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: inherit;
}

.my-playlist-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.2s;
}
.my-playlist-item:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
.my-playlist-item .pl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.my-playlist-item .pl-title { font-weight: 700; font-size: 0.95rem; color: var(--text); flex: 1; }
.my-playlist-item .pl-count { background: var(--grad-brand); color: white; font-size: 0.72rem; padding: 2px 10px; border-radius: var(--r-full); font-weight: 700; }
.my-playlist-item .pl-actions { display: flex; gap: 6px; }
.my-playlist-item .pl-actions button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-2);
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
}
.my-playlist-item .pl-actions button:hover { border-color: var(--primary); color: var(--primary); }
.my-playlist-item .pl-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }

.playlist-video-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--r-sm);
    transition: background 0.2s;
    cursor: pointer;
}
.playlist-video-item:hover { background: var(--bg-light); }
.playlist-video-item .pv-thumb { width: 80px; height: 45px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; color: white; font-size: 1rem; }
.playlist-video-item .pv-info { flex: 1; min-width: 0; }
.playlist-video-item .pv-title { font-size: 0.82rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playlist-video-item .pv-channel { font-size: 0.72rem; color: var(--text-muted); }
.playlist-video-item .pv-remove { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 1.2rem; padding: 4px; transition: color 0.2s; }
.playlist-video-item .pv-remove:hover { color: var(--danger); }

.player-view-enhanced {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
}
@media (max-width: 900px) {
    .player-view-enhanced { grid-template-columns: 1fr; }
}

.player-controls-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--bg-card);
    border-radius: var(--r);
    border: 1px solid var(--border);
    margin-bottom: 10px;
}
.player-controls-bar button {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-light);
    color: var(--text-2);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.player-controls-bar button:hover { border-color: var(--primary); color: var(--primary); }
.player-controls-bar button.active { background: var(--primary); color: white; border-color: transparent; }

.up-next-list {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
}
.up-next-header {
    padding: 12px 14px;
    background: var(--bg-light);
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--text);
}
.up-next-item {
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border-soft);
}
.up-next-item:last-child { border-bottom: none; }
.up-next-item:hover { background: var(--bg-light); }
.up-next-item.active { background: rgba(102, 126, 234, 0.08); }
.up-next-item .un-thumb { width: 100px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; color: white; }
.up-next-item .un-info { flex: 1; min-width: 0; }
.up-next-item .un-title { font-size: 0.8rem; font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.up-next-item .un-channel { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

.loading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}
.skeleton-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
}
.skeleton-thumb { aspect-ratio: 16/9; background: var(--bg-light); animation: shimmer-bg 1.5s infinite; }
.skeleton-line { height: 12px; background: var(--bg-light); border-radius: 4px; margin: 8px 14px; animation: shimmer-bg 1.5s infinite; }
.skeleton-line.short { width: 60%; }
@keyframes shimmer-bg {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
</style>

<script>
// ============ Storage Keys ============
const NOTES_KEY = 'sohcse_video_notes';
const BOOKMARKS_KEY = 'sohcse_video_bookmarks';
const RECENT_KEY = 'sohcse_video_recent';
const CUSTOM_PL_KEY = 'sohcse_video_custom_playlists';
const CURRENT_PL_KEY = 'sohcse_video_current_playlist';

// ============ State ============
let state = {
    view: 'browse',         // 'browse' | 'search' | 'player' | 'playlists'
    tab: 'curated',         // 'curated' | 'search' | 'playlists' | 'bookmarks'
    subject: 'algorithms',
    currentPlaylist: null,
    currentSideTab: 'notes',
    searchQuery: '',
    searchResults: [],
    searchLoading: false,
    currentVideoIndex: 0,   // index in current playlist/video queue
    queue: [],              // array of video objects for up-next
};

// ============ Storage Helpers ============
function getJSON(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function setJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function getNotes(id) { return getJSON(NOTES_KEY, {})[id] || []; }
function saveNote(id, text, time) { const all = getJSON(NOTES_KEY, {}); if (!all[id]) all[id] = []; all[id].push({ time: time || 0, text, createdAt: Date.now() }); setJSON(NOTES_KEY, all); }
function deleteNote(id, createdAt) { const all = getJSON(NOTES_KEY, {}); if (!all[id]) return; all[id] = all[id].filter(n => n.createdAt !== createdAt); setJSON(NOTES_KEY, all); }

function getBookmarks() { return getJSON(BOOKMARKS_KEY, []); }
function isBookmarked(id) { return getBookmarks().some(b => b.id === id); }
function toggleBookmark(p) {
    const bm = getBookmarks();
    const idx = bm.findIndex(b => b.id === p.id);
    if (idx >= 0) { bm.splice(idx, 1); setJSON(BOOKMARKS_KEY, bm); return false; }
    bm.push({ id: p.id, title: p.title, channel: p.channel, thumb: p.thumb, subject: state.subject, addedAt: Date.now() });
    setJSON(BOOKMARKS_KEY, bm);
    return true;
}

function getRecent() { return getJSON(RECENT_KEY, []); }
function addRecent(p) {
    let r = getRecent().filter(x => x.id !== p.id);
    r.unshift({ id: p.id, title: p.title, channel: p.channel, thumb: p.thumb, subject: state.subject, playedAt: Date.now() });
    r = r.slice(0, 12);
    setJSON(RECENT_KEY, r);
}

function getCustomPlaylists() { return getJSON(CUSTOM_PL_KEY, []); }
function createCustomPlaylist(name) {
    const pls = getCustomPlaylists();
    const pl = { id: 'pl_' + Date.now(), name, videos: [], createdAt: Date.now() };
    pls.push(pl);
    setJSON(CUSTOM_PL_KEY, pls);
    return pl;
}
function deleteCustomPlaylist(id) {
    let pls = getCustomPlaylists();
    pls = pls.filter(p => p.id !== id);
    setJSON(CUSTOM_PL_KEY, pls);
}
function addToCustomPlaylist(plId, video) {
    const pls = getCustomPlaylists();
    const pl = pls.find(p => p.id === plId);
    if (!pl) return false;
    if (pl.videos.some(v => v.id === video.id)) return false; // already exists
    pl.videos.push(video);
    setJSON(CUSTOM_PL_KEY, pls);
    return true;
}
function removeFromCustomPlaylist(plId, videoId) {
    const pls = getCustomPlaylists();
    const pl = pls.find(p => p.id === plId);
    if (!pl) return;
    pl.videos = pl.videos.filter(v => v.id !== videoId);
    setJSON(CUSTOM_PL_KEY, pls);
}
function isVideoInAnyPlaylist(videoId) {
    return getCustomPlaylists().some(pl => pl.videos.some(v => v.id === videoId));
}

function parseYouTubeUrl(url) {
    const pl = url.match(/[?&]list=([^&\s]+)/);
    if (pl) return { type: 'playlist', id: pl[1] };
    const sh = url.match(/youtu\.be\/([^?\s]+)/);
    if (sh) return { type: 'video', id: sh[1] };
    const w = url.match(/[?&]v=([^&\s]+)/);
    if (w) return { type: 'video', id: w[1] };
    if (/^[A-Za-z0-9_-]{11}$/.test(url)) return { type: 'video', id: url };
    if (/^(PL|UU|FL|RD|OL)[A-Za-z0-9_-]+$/.test(url)) return { type: 'playlist', id: url };
    return null;
}

function buildEmbedUrl(p) {
    if (p.type === 'search' && p.searchQuery) return `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(p.searchQuery)}&autoplay=1`;
    if (p.type === 'video') return `https://www.youtube.com/embed/${p.id}?autoplay=1&rel=0&modestbranding=1`;
    return `https://www.youtube.com/embed/videoseries?list=${p.id}&autoplay=1&rel=0&modestbranding=1`;
}
function buildYouTubeLink(p) {
    if (p.type === 'search' && p.searchQuery) return `https://www.youtube.com/results?search_query=${encodeURIComponent(p.searchQuery)}`;
    if (p.type === 'video') return `https://www.youtube.com/watch?v=${p.id}`;
    return `https://www.youtube.com/playlist?list=${p.id}`;
}
function getThumbUrl(p) {
    if (p.thumb) return p.thumb;
    if (p.type === 'video') return `https://img.youtube.com/vi/${p.id}/mqdefault.jpg`;
    return null;
}

// ============ YouTube Search (using search embed workaround) ============
// Since we can't use YouTube Data API without a key, we'll use a clever approach:
// Open the search in a hidden iframe, extract video IDs from thumbnail URLs.
// For a real implementation, user would need a YouTube Data API key.
// As fallback, we provide curated search links that open in the app player.

function performSearch(query) {
    state.searchQuery = query;
    state.searchLoading = true;
    state.searchResults = [];
    state.tab = 'search';
    renderBrowse();

    // We'll generate "search result" cards that link to YouTube search embeds
    // This is a practical approach without API key
    // Each "result" is a search-embed for the query + subject context
    setTimeout(() => {
        // Generate practical search-based video entries
        const subjectLabel = VIDEO_CATALOG[state.subject]?.label || '';
        const results = [
            {
                id: 'search_' + Date.now() + '_1',
                type: 'search',
                searchQuery: `${query} GATE CSE`,
                title: `"${query}" — GATE CSE Videos`,
                channel: 'YouTube Search',
                description: `Live YouTube search for "${query}" GATE CSE. Plays most relevant videos.`,
                videos: '∞',
                thumb: null
            },
            {
                id: 'search_' + Date.now() + '_2',
                type: 'search',
                searchQuery: `${query} lecture`,
                channel: 'YouTube Search',
                title: `"${query}" — Full Lectures`,
                description: `Full lecture videos on "${query}". Comprehensive coverage.`,
                videos: '∞',
                thumb: null
            },
            {
                id: 'search_' + Date.now() + '_3',
                type: 'search',
                searchQuery: `${query} GATE previous year solved`,
                title: `"${query}" — PYQ Solutions`,
                channel: 'YouTube Search',
                description: `Previous year question solutions for "${query}". Step-by-step explanations.`,
                videos: '∞',
                thumb: null
            },
            {
                id: 'search_' + Date.now() + '_4',
                type: 'search',
                searchQuery: `${query} shortcut tricks`,
                title: `"${query}" — Shortcuts & Tricks`,
                channel: 'YouTube Search',
                description: `Quick techniques and shortcuts for "${query}" problems.`,
                videos: '∞',
                thumb: null
            }
        ];

        state.searchResults = results;
        state.searchLoading = false;
        renderBrowse();
    }, 500);
}

// ============ Init ============
function init() {
    const params = new URLSearchParams(location.search);
    const subj = params.get('subject');
    state.subject = (subj && VIDEO_CATALOG[subj]) ? subj : 'algorithms';
    renderBrowse();
}

// ============ Render Browse View ============
function renderBrowse() {
    state.view = 'browse';
    state.currentPlaylist = null;
    const subjectKeys = Object.keys(VIDEO_CATALOG);
    const subj = VIDEO_CATALOG[state.subject];
    const bookmarks = getBookmarks();
    const recent = getRecent();
    const customPls = getCustomPlaylists();

    document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;margin-bottom:24px;">
            <div style="font-size:3rem;margin-bottom:8px;">🎥</div>
            <h1 style="font-size:1.8rem;font-weight:800;color:var(--text);margin-bottom:4px;">Video Lectures</h1>
            <p style="color:var(--text-muted);font-size:0.92rem;max-width:680px;margin:0 auto;">Search YouTube, watch curated playlists, create custom playlists, and take timestamped notes — all inside the app.</p>
        </div>

        <!-- Search bar -->
        <div class="video-search-bar">
            <input type="text" id="videoSearchInput" placeholder="🔍 Search for any topic (e.g., 'binary search', 'deadlock', 'normalization')..." onkeydown="if(event.key==='Enter') performSearch(this.value)">
            <button onclick="performSearch(document.getElementById('videoSearchInput').value)">🔍 Search</button>
        </div>

        <!-- Tab bar -->
        <div class="tab-bar">
            <button class="tab-btn ${state.tab === 'curated' ? 'active' : ''}" onclick="setTab('curated')">📚 Curated</button>
            <button class="tab-btn ${state.tab === 'search' ? 'active' : ''}" onclick="setTab('search')">🔍 Search Results</button>
            <button class="tab-btn ${state.tab === 'playlists' ? 'active' : ''}" onclick="setTab('playlists')">🎵 My Playlists (${customPls.length})</button>
            <button class="tab-btn ${state.tab === 'bookmarks' ? 'active' : ''}" onclick="setTab('bookmarks')">⭐ Bookmarks (${bookmarks.length})</button>
            <button class="tab-btn ${state.tab === 'recent' ? 'active' : ''}" onclick="setTab('recent')">🕘 Recent</button>
        </div>

        <!-- Subject tabs (for curated) -->
        ${state.tab === 'curated' ? `
            <div class="video-subject-tabs" style="margin-bottom:20px;">
                ${subjectKeys.map(k => `<button class="video-subject-tab ${k === state.subject ? 'active' : ''}" onclick="selectSubject('${k}')">${VIDEO_CATALOG[k].icon} ${VIDEO_CATALOG[k].label}</button>`).join('')}
            </div>
        ` : ''}

        <div id="tabContent">${renderTabContent()}</div>
    `;
}

function renderTabContent() {
    if (state.tab === 'curated') return renderCuratedTab();
    if (state.tab === 'search') return renderSearchTab();
    if (state.tab === 'playlists') return renderPlaylistsTab();
    if (state.tab === 'bookmarks') return renderBookmarksTab();
    if (state.tab === 'recent') return renderRecentTab();
    return '';
}

function renderCuratedTab() {
    const subj = VIDEO_CATALOG[state.subject];
    const recent = getRecent();
    return `
        <div class="section-eyebrow">${subj.icon} ${subj.label} — Curated Playlists</div>
        <div class="playlist-grid" style="margin-bottom:24px;">
            ${subj.playlists.map(p => renderPlaylistCard(p)).join('')}
        </div>

        ${recent.length > 0 ? `
            <div class="section-eyebrow">🕘 Recently Watched</div>
            <div class="playlist-grid" style="margin-bottom:24px;">
                ${recent.slice(0, 4).map(p => renderPlaylistCard(p)).join('')}
            </div>
        ` : ''}

        <div class="section-eyebrow">📺 Recommended ${subj.label} Channels</div>
        <div class="subjects-grid">
            ${subj.channels.map(c => `<a class="subject-card" href="${c.url}" target="_blank" rel="noopener" style="text-decoration:none;"><div class="card-top"><div class="card-icon">📺</div><div class="count-badge">↗</div></div><div class="card-title">${c.name}</div><div class="card-meta">${c.why}</div></a>`).join('')}
        </div>
    `;
}

function renderSearchTab() {
    if (state.searchLoading) {
        return `
            <div class="loading-grid">
                ${Array(4).fill(0).map(() => '<div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>').join('')}
            </div>
        `;
    }
    if (state.searchResults.length === 0) {
        return `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>Search for videos</h3>
                <p>Use the search bar above to find YouTube videos on any GATE CSE topic. Results play inside the app.</p>
            </div>
        `;
    }
    return `
        <div class="section-eyebrow">🔍 Search Results for "${escapeHtml(state.searchQuery)}"</div>
        <div class="search-results-grid">
            ${state.searchResults.map(r => renderSearchResultCard(r)).join('')}
        </div>
    `;
}

function renderPlaylistsTab() {
    const pls = getCustomPlaylists();
    return `
        <div class="playlist-selector">
            <h3 style="font-size:0.95rem;margin-bottom:8px;">🎵 Create New Playlist</h3>
            <div class="playlist-selector-actions">
                <input type="text" id="newPlaylistName" placeholder="Playlist name (e.g., 'Revision Videos')" onkeydown="if(event.key==='Enter') createPlaylistFromInput()">
                <button onclick="createPlaylistFromInput()">+ Create</button>
            </div>
        </div>
        ${pls.length === 0 ? `
            <div class="empty-state">
                <div class="empty-icon">🎵</div>
                <h3>No custom playlists yet</h3>
                <p>Create a playlist above, then add videos from search results or curated playlists.</p>
            </div>
        ` : `
            <div class="section-eyebrow">Your Custom Playlists (${pls.length})</div>
            ${pls.map(pl => renderCustomPlaylistItem(pl)).join('')}
        `}
    `;
}

function renderCustomPlaylistItem(pl) {
    return `
        <div class="my-playlist-item">
            <div class="pl-header">
                <span style="font-size:1.2rem;">🎵</span>
                <span class="pl-title">${escapeHtml(pl.name)}</span>
                <span class="pl-count">${pl.videos.length} video${pl.videos.length !== 1 ? 's' : ''}</span>
                <div class="pl-actions">
                    <button onclick="playCustomPlaylist('${pl.id}')">▶ Play</button>
                    <button class="danger" onclick="if(confirm('Delete playlist?')) { deleteCustomPlaylist('${pl.id}'); renderBrowse(); }">🗑 Delete</button>
                </div>
            </div>
            ${pl.videos.length > 0 ? `
                <div style="margin-top:8px;">
                    ${pl.videos.slice(0, 5).map(v => `
                        <div class="playlist-video-item" onclick="playVideo('${v.id}', '${v.type || 'video'}', ${JSON.stringify(v).replace(/'/g, '&#39;').replace(/"/g, '&quot;')})">
                            <div class="pv-thumb">${v.type === 'search' ? '🔍' : '▶'}</div>
                            <div class="pv-info">
                                <div class="pv-title">${escapeHtml(v.title)}</div>
                                <div class="pv-channel">${escapeHtml(v.channel || '')}</div>
                            </div>
                            <button class="pv-remove" onclick="event.stopPropagation(); removeFromCustomPlaylist('${pl.id}', '${v.id}'); renderBrowse();" title="Remove">×</button>
                        </div>
                    `).join('')}
                    ${pl.videos.length > 5 ? `<p style="font-size:0.78rem;color:var(--text-muted);padding:8px;">+ ${pl.videos.length - 5} more video${pl.videos.length - 5 !== 1 ? 's' : ''}...</p>` : ''}
                </div>
            ` : '<p style="font-size:0.82rem;color:var(--text-muted);padding:8px 0;">No videos yet. Search and add videos to this playlist.</p>'}
        </div>
    `;
}

function renderBookmarksTab() {
    const bm = getBookmarks();
    if (bm.length === 0) return '<div class="empty-state"><div class="empty-icon">⭐</div><h3>No bookmarks yet</h3><p>Click the heart icon on any video to bookmark it.</p></div>';
    return `<div class="section-eyebrow">Your Bookmarked Videos (${bm.length})</div><div class="playlist-grid">${bm.map(p => renderPlaylistCard(p)).join('')}</div>`;
}

function renderRecentTab() {
    const r = getRecent();
    if (r.length === 0) return '<div class="empty-state"><div class="empty-icon">🕘</div><h3>No recently watched videos</h3><p>Start watching to build your history.</p></div>';
    return `<div class="section-eyebrow">Recently Watched (${r.length})</div><div class="playlist-grid">${r.map(p => renderPlaylistCard(p)).join('')}</div>`;
}

function renderPlaylistCard(p) {
    const isBm = isBookmarked(p.id);
    const ytLink = buildYouTubeLink(p);
    const isSearch = p.type === 'search';
    const pJson = JSON.stringify(p).replace(/'/g, "&#39;");
    const thumbContent = getThumbUrl(p)
        ? `<img src="${getThumbUrl(p)}" alt="${escapeHtml(p.title)}" onerror="this.style.display='none';this.parentElement.querySelector('.thumb-icon').style.display='block'"><div class="thumb-icon" style="display:none;font-size:3rem;opacity:0.9;">${isSearch ? '🔍' : '▶'}</div>`
        : `<div class="thumb-icon" style="font-size:3rem;opacity:0.9;">${isSearch ? '🔍' : '▶'}</div>`;

    return `
        <div class="playlist-card" onclick='playPlaylist(${pJson})'>
            <div class="playlist-thumb">
                ${thumbContent}
                <div class="play-overlay"><div class="play-icon">${isSearch ? '🔍' : '▶'}</div></div>
            </div>
            <div class="playlist-info">
                <div class="playlist-title">${escapeHtml(p.title)}</div>
                <div class="playlist-channel">${escapeHtml(p.channel || 'YouTube')} ${p.videos && p.videos !== '∞' ? `• ${p.videos} videos` : (p.videos === '∞' ? '• all matches' : '')}</div>
                <div class="playlist-desc">${escapeHtml(p.description || '')}</div>
                <div class="playlist-actions">
                    <button class="btn btn-ghost btn-sm" onclick='event.stopPropagation(); playPlaylist(${pJson})'>${isSearch ? '🔍 Play' : '▶ Play'}</button>
                    <button class="btn btn-ghost btn-sm ${isBm ? 'bookmarked' : ''}" onclick='event.stopPropagation(); toggleBookmarkUI(${pJson})' title="Bookmark">${isBm ? '❤' : '🤍'}</button>
                    <a href="${ytLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="btn btn-ghost btn-sm" title="Open on YouTube">↗</a>
                    <button class="btn btn-ghost btn-sm" onclick='event.stopPropagation(); showAddToPlaylist(${pJson})' title="Add to playlist">➕</button>
                    ${isSearch ? '<span class="playlist-badge" style="background:rgba(102,126,234,0.1);color:var(--primary);">SEARCH</span>' : ''}
                </div>
            </div>
        </div>
    `;
}

function renderSearchResultCard(r) {
    const isBm = isBookmarked(r.id);
    const inPlaylist = isVideoInAnyPlaylist(r.id);
    const rJson = JSON.stringify(r).replace(/'/g, "&#39;");
    return `
        <div class="search-result-card">
            <div class="search-result-thumb" onclick='playPlaylist(${rJson})'>
                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:white;">🔍</div>
                <div class="play-overlay"><div class="play-icon">🔍</div></div>
            </div>
            <div class="search-result-info">
                <div class="search-result-title">${escapeHtml(r.title)}</div>
                <div class="search-result-channel">${escapeHtml(r.channel)}</div>
                <div class="search-result-meta">${escapeHtml(r.description || '')}</div>
                <div class="search-result-actions">
                    <button onclick='playPlaylist(${rJson})'>▶ Play</button>
                    <button class="${inPlaylist ? 'added' : ''}" onclick='showAddToPlaylist(${rJson})'>${inPlaylist ? '✓ Added' : '➕ Add'}</button>
                    <button class="${isBm ? 'added' : ''}" onclick='toggleBookmarkUI(${rJson})'>${isBm ? '❤' : '🤍'}</button>
                </div>
            </div>
        </div>
    `;
}

// ============ Tab & Subject switching ============
function setTab(tab) { state.tab = tab; renderBrowse(); }
function selectSubject(slug) { state.subject = slug; renderBrowse(); }

function toggleBookmarkUI(p) {
    toggleBookmark(p);
    renderBrowse();
}

function showAddToPlaylist(video) {
    const pls = getCustomPlaylists();
    if (pls.length === 0) {
        const name = prompt('No playlists yet. Create one named:');
        if (!name) return;
        const pl = createCustomPlaylist(name);
        addToCustomPlaylist(pl.id, { id: video.id, title: video.title, channel: video.channel, type: video.type, searchQuery: video.searchQuery, thumb: getThumbUrl(video) });
        if (window.showToast) window.showToast('✅ Added to "' + name + '"', 'success');
        renderBrowse();
        return;
    }
    // Show a dialog
    const options = pls.map(p => {
        const has = p.videos.some(v => v.id === video.id);
        return `${has ? '✓' : '○'} ${p.name} (${p.videos.length})`;
    }).join('\n');
    const choice = prompt('Choose a playlist:\n\n' + options + '\n\nType the playlist name (or "new" to create one):');
    if (!choice) return;
    if (choice.toLowerCase() === 'new') {
        const name = prompt('New playlist name:');
        if (!name) return;
        const pl = createCustomPlaylist(name);
        addToCustomPlaylist(pl.id, { id: video.id, title: video.title, channel: video.channel, type: video.type, searchQuery: video.searchQuery, thumb: getThumbUrl(video) });
        if (window.showToast) window.showToast('✅ Added to "' + name + '"', 'success');
    } else {
        const pl = pls.find(p => p.name.toLowerCase() === choice.toLowerCase());
        if (!pl) { if (window.showToast) window.showToast('Playlist not found', 'error'); return; }
        const added = addToCustomPlaylist(pl.id, { id: video.id, title: video.title, channel: video.channel, type: video.type, searchQuery: video.searchQuery, thumb: getThumbUrl(video) });
        if (window.showToast) window.showToast(added ? '✅ Added to "' + pl.name + '"' : 'Already in playlist', added ? 'success' : 'warning');
    }
    renderBrowse();
}

function createPlaylistFromInput() {
    const name = document.getElementById('newPlaylistName').value.trim();
    if (!name) { alert('Enter a playlist name'); return; }
    createCustomPlaylist(name);
    if (window.showToast) window.showToast('✅ Playlist "' + name + '" created', 'success');
    renderBrowse();
}

function playCustomPlaylist(plId) {
    const pls = getCustomPlaylists();
    const pl = pls.find(p => p.id === plId);
    if (!pl || pl.videos.length === 0) { alert('Playlist is empty'); return; }
    state.queue = pl.videos;
    state.currentVideoIndex = 0;
    state.currentPlaylist = { id: pl.id, title: pl.name, channel: 'Your Playlist', videos: pl.videos.length };
    playCurrentInQueue();
}

function playVideo(id, type, meta) {
    state.queue = [meta];
    state.currentVideoIndex = 0;
    state.currentPlaylist = meta;
    playCurrentInQueue();
}

// ============ Player View ============
function playPlaylist(meta) {
    state.view = 'player';
    state.currentPlaylist = meta;
    addRecent(meta);
    // If it's a curated playlist, build a queue from the subject's other playlists
    const subj = VIDEO_CATALOG[state.subject];
    if (subj) {
        state.queue = subj.playlists.filter(p => p.id !== meta.id).slice(0, 5);
        state.currentVideoIndex = -1; // current is separate
    } else {
        state.queue = [];
        state.currentVideoIndex = -1;
    }
    renderPlayer();
}

function playCurrentInQueue() {
    state.view = 'player';
    state.currentPlaylist = state.queue[state.currentVideoIndex];
    addRecent(state.currentPlaylist);
    renderPlayer();
}

function renderPlayer() {
    const p = state.currentPlaylist;
    if (!p) return;
    const isBm = isBookmarked(p.id);
    const embedUrl = buildEmbedUrl(p);
    const ytLink = buildYouTubeLink(p);

    document.getElementById('mainContent').innerHTML = `
        <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="renderBrowse()">← Back to videos</button>

        <div class="player-view-enhanced">
            <div class="player-main">
                <div class="player-frame-wrap">
                    <iframe src="${embedUrl}" title="${escapeHtml(p.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>

                <!-- Player controls -->
                <div class="player-controls-bar">
                    <button onclick="openInNewTab('${ytLink}')" title="Open on YouTube">↗ YouTube</button>
                    <button class="${isBm ? 'active' : ''}" onclick="toggleBookmarkUIPlayer()" title="Bookmark">${isBm ? '❤ Saved' : '🤍 Save'}</button>
                    <button onclick='showAddToPlaylist(${JSON.stringify(p).replace(/'/g, "&#39;")})' title="Add to playlist">➕ Add to Playlist</button>
                    <button onclick="toggleFullscreen()" title="Fullscreen">⛶ Fullscreen</button>
                    <button onclick="openInNewTab('${ytLink}')" title="Picture in picture (via YouTube)">⊨ PiP</button>
                </div>

                <div class="player-meta">
                    <h2>${escapeHtml(p.title)}</h2>
                    <div class="meta-row">
                        <span>📺 ${escapeHtml(p.channel || 'YouTube')}</span>
                        ${p.videos && p.videos !== '∞' ? `<span>• ${p.videos} videos</span>` : ''}
                    </div>
                    <div style="margin-top:10px;font-size:0.82rem;color:var(--text-muted);background:var(--bg-light);padding:10px 12px;border-radius:8px;">
                        💡 <strong>Note:</strong> Enter timestamps in your notes (e.g., "5:30") to jump to that point on YouTube. Click the timestamp link to open YouTube at that exact time.
                    </div>
                </div>
            </div>

            <div class="player-side">
                <!-- Up Next -->
                ${state.queue && state.queue.length > 0 ? `
                    <div class="up-next-list" style="margin-bottom:14px;">
                        <div class="up-next-header">▶ Up Next</div>
                        ${state.queue.map((v, i) => `
                            <div class="up-next-item ${i === state.currentVideoIndex ? 'active' : ''}" onclick="playQueueItem(${i})">
                                <div class="un-thumb">${v.type === 'search' ? '🔍' : '▶'}</div>
                                <div class="un-info">
                                    <div class="un-title">${escapeHtml(v.title)}</div>
                                    <div class="un-channel">${escapeHtml(v.channel || 'YouTube')}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <!-- Notes / Bookmarks tabs -->
                <div class="side-card">
                    <div class="side-tabs">
                        <button class="side-tab ${state.currentSideTab === 'notes' ? 'active' : ''}" onclick="setSideTab('notes')">📝 Notes</button>
                        <button class="side-tab ${state.currentSideTab === 'bookmarks' ? 'active' : ''}" onclick="setSideTab('bookmarks')">⭐ Saved</button>
                        <button class="side-tab ${state.currentSideTab === 'recent' ? 'active' : ''}" onclick="setSideTab('recent')">🕘 Recent</button>
                    </div>
                    <div class="side-content" id="sideContent">${renderSideContent()}</div>
                </div>
            </div>
        </div>
    `;
}

function playQueueItem(idx) {
    if (idx < 0 || idx >= state.queue.length) return;
    state.currentVideoIndex = idx;
    state.currentPlaylist = state.queue[idx];
    addRecent(state.currentPlaylist);
    renderPlayer();
    document.getElementById('contentArea').scrollTop = 0;
}

function openInNewTab(url) { window.open(url, '_blank', 'noopener'); }
function toggleFullscreen() {
    const iframe = document.querySelector('.player-frame-wrap iframe');
    if (iframe) { if (iframe.requestFullscreen) iframe.requestFullscreen(); }
}

function toggleBookmarkUIPlayer() {
    const p = state.currentPlaylist;
    if (!p) return;
    toggleBookmark(p);
    renderPlayer();
}

function renderSideContent() {
    const p = state.currentPlaylist;
    if (state.currentSideTab === 'notes') {
        const notes = getNotes(p.id);
        return `
            <div class="note-input-wrap">
                <input type="text" id="noteTimeInput" placeholder="Timestamp (e.g. 5:30)" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:8px;background:var(--bg-light);color:var(--text);">
                <textarea id="noteInput" placeholder="Type your note..." style="background:var(--bg-light);color:var(--text);"></textarea>
                <div class="note-actions"><button class="btn btn-ghost btn-sm" onclick="saveNoteFromInput()">💾 Save</button></div>
            </div>
            <div>
                ${notes.length === 0 ? '<div class="empty-side"><div class="empty-icon">📝</div><div>No notes yet. Add your first note above.</div></div>' : notes.slice().reverse().map(n => `
                    <div class="note-item">
                        <div class="note-header">
                            <a class="note-time" href="${buildYouTubeLink(p)}&t=${Math.floor(parseTimeToSeconds(n.time))}s" target="_blank">▶ ${escapeHtml(n.time || '0:00')}</a>
                            <button class="note-delete" onclick="deleteNoteUI(${n.createdAt})">×</button>
                        </div>
                        <div class="note-text">${escapeHtml(n.text)}</div>
                    </div>
                `).join('')}
            </div>
        `;
    } else if (state.currentSideTab === 'bookmarks') {
        const bm = getBookmarks();
        if (bm.length === 0) return '<div class="empty-side"><div class="empty-icon">⭐</div><div>No bookmarks yet.</div></div>';
        return bm.map(b => {
            const bJson = JSON.stringify(b).replace(/'/g, "&#39;");
            return `<div class="note-item" style="cursor:pointer;" onclick='playPlaylist(${bJson})'><div class="note-header"><span style="font-size:0.78rem;font-weight:600;">${escapeHtml(b.title)}</span><button class="note-delete" onclick="event.stopPropagation(); toggleBookmarkUI(${bJson}); renderPlayer();">×</button></div><div style="font-size:0.72rem;color:var(--text-muted);">📺 ${escapeHtml(b.channel || '')}</div></div>`;
        }).join('');
    } else if (state.currentSideTab === 'recent') {
        const r = getRecent();
        if (r.length === 0) return '<div class="empty-side"><div class="empty-icon">🕘</div><div>No recent videos.</div></div>';
        return r.map(item => {
            const iJson = JSON.stringify(item).replace(/'/g, "&#39;");
            return `<div class="note-item" style="cursor:pointer;" onclick='playPlaylist(${iJson})'><div class="note-header"><span style="font-size:0.78rem;font-weight:600;">${escapeHtml(item.title)}</span></div><div style="font-size:0.72rem;color:var(--text-muted);">📺 ${escapeHtml(item.channel || '')} • ${timeAgo(item.playedAt)}</div></div>`;
        }).join('');
    }
    return '';
}

function parseTimeToSeconds(t) {
    if (!t) return 0;
    const parts = String(t).split(':').map(x => parseInt(x, 10));
    if (parts.some(isNaN)) return 0;
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
}
function setSideTab(tab) { state.currentSideTab = tab; const sc = document.getElementById('sideContent'); if (sc) sc.innerHTML = renderSideContent(); }
function saveNoteFromInput() {
    const input = document.getElementById('noteInput');
    const timeInput = document.getElementById('noteTimeInput');
    if (!input || !input.value.trim()) { alert('Type a note first.'); return; }
    const p = state.currentPlaylist;
    saveNote(p.id, input.value.trim(), timeInput ? timeInput.value.trim() : '');
    input.value = ''; if (timeInput) timeInput.value = '';
    setSideTab('notes');
    if (window.showToast) window.showToast('✅ Note saved', 'success');
}
function deleteNoteUI(createdAt) { const p = state.currentPlaylist; deleteNote(p.id, createdAt); setSideTab('notes'); }
function timeAgo(ts) { const diff = Date.now() - ts; const mins = Math.floor(diff / 60000); if (mins < 1) return 'just now'; if (mins < 60) return `${mins}m ago`; const hrs = Math.floor(mins / 60); if (hrs < 24) return `${hrs}h ago`; const days = Math.floor(hrs / 24); if (days < 7) return `${days}d ago`; return new Date(ts).toLocaleDateString(); }
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

init();
</script>
<script src="./nav.js"></script>
<script src="./theme.js"></script>
</body>
</html>
