name: Daily GATE CSE Multi-Source Data Refresh

on:
  schedule:
    # Run daily at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Soham-0047"
          git config user.email "Soham-0047@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Fetch questions from multiple sources (ExamSIDE + Mockers + GeeksforGeeks)
        id: fetch
        run: python scripts/multi-source-fetcher.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "Daily multi-source refresh: $(date -u '+%Y-%m-%d')

          Sources checked:
          - ExamSIDE.com (existing PYQs)
          - Mockers.in (free GATE CSE mock tests)
          - GeeksforGeeks (topic-wise PYQ quizzes)

          Auto-merged with deduplication via content hashing."
          git push

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily data refresh failed - ${new Date().toISOString().split('T')[0]}`,
              body: 'The automated multi-source data refresh workflow failed. Check the [workflow logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions) for details.',
              labels: ['automated', 'data-refresh']
            })
