<script>
// ============ Storage keys ============
const KEYS = {
    QUIZ_RESULTS: 'sohcse_quiz_results',
    PRACTICE: 'sohcse_practice_state_v1',
    FLASHCARD: 'sohcse_flashcard_state_v1',
    BOOKMARKS: 'sohcse_question_bookmarks',
    STUDY_LOG: 'sohcse_study_log_v1',
    STREAK: 'sohcse_streak_v1'
};

// ============ Helpers ============
function getJSON(key, def) {
    try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function setJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

function getStudyLog() {
    return getJSON(KEYS.STUDY_LOG, {});
}
function logStudyDay() {
    const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
    const log = getStudyLog();
    log[today] = (log[today] || 0) + 1;
    setJSON(KEYS.STUDY_LOG, log);
    updateStreak(today);
}
function updateStreak(today) {
    const streak = getJSON(KEYS.STREAK, { count: 0, lastDay: null });
    if (streak.lastDay === today) return;
    // Check if yesterday
    if (streak.lastDay) {
        const last = new Date(streak.lastDay);
        const t = new Date(today);
        const diff = (t - last) / (1000 * 60 * 60 * 24);
        if (diff === 1) {
            streak.count = (streak.count || 0) + 1;
        } else if (diff > 1) {
            streak.count = 1; // reset
        }
    } else {
        streak.count = 1;
    }
    streak.lastDay = today;
    setJSON(KEYS.STREAK, streak);
}

// Log today's visit (called on init)
logStudyDay();

// ============ Init ============
function renderWeakAreas() {
    const section = document.getElementById('weakAreaSection');
    if (!section) return;
    
    const weakChapters = (typeof window.getWeakChapters === 'function') ? window.getWeakChapters(60) : [];
    
    if (weakChapters.length === 0) {
        section.innerHTML = '';
        return;
    }
    
    const subjIcons = {
        'algorithms': '⚡', 'data-structures': '🌳', 'discrete-mathematics': '∑',
        'operating-systems': '⚙️', 'database-management-system': '🗄️',
        'computer-networks': '🌐', 'theory-of-computation': '🔤',
        'compiler-design': '🔧', 'digital-logic': '🔌',
        'computer-organization': '💻', 'general-aptitude': '🧮'
    };
    
    section.innerHTML = `
        <div class="weak-area-card">
            <div class="weak-area-header">
                <span style="font-size:1.3rem;">🎯</span>
                <span class="weak-area-title">Weak Areas — Focus Here</span>
            </div>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px;">
                These chapters have accuracy below 60%. Practice more or let AI generate similar questions to drill.
            </p>
            <div class="weak-area-list">
                ${weakChapters.slice(0, 5).map(w => {
                    const accColor = w.accuracy >= 40 ? '#f59e0b' : '#ef4444';
                    const subjLabel = w.subject ? w.subject.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '';
                    return `
                        <div class="weak-area-item">
                            <div class="weak-area-info">
                                <div class="weak-area-name">${subjIcons[w.subject] || '📖'} ${subjLabel}</div>
                                <div class="weak-area-stats">${w.correct}/${w.total} correct • ${w.accuracy}% accuracy</div>
                            </div>
                            <div class="weak-area-accuracy" style="background:${accColor}20;color:${accColor};">${w.accuracy}%</div>
                            <div class="weak-area-actions">
                                <a href="./pyq.html?subject=${w.subject}&chapter=${w.chapter || ''}" class="weak-area-btn">📝 Practice</a>
                                <button class="weak-area-btn ai-btn" onclick="drillWeakArea('${w.subject}', '${subjLabel}')">🤖 AI Drill</button>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
}

function drillWeakArea(subject, label) {
    if (typeof window.SOH_AI !== 'undefined') {
        window.SOH_AI.open();
        window.SOH_AI.setMode('quiz');
        setTimeout(() => {
            const input = document.getElementById('aiChatInput');
            if (input) {
                input.value = `Generate 5 GATE CSE practice questions on ${label}. My accuracy in this area is below 60%, so focus on fundamental concepts and common pitfalls. Mix MCQ and NAT types.`;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }, 300);
        if (window.showToast) window.showToast('🤖 AI generating practice questions for ' + label, 'info', 3000);
    }
}

function init() {
    renderDashboard();
}

function renderDashboard() {
    const streak = getJSON(KEYS.STREAK, { count: 0, lastDay: null });
    const studyLog = getStudyLog();
    const quizResults = getJSON(KEYS.QUIZ_RESULTS, []);
    const practice = getJSON(KEYS.PRACTICE, {});
    const flashcardState = getJSON(KEYS.FLASHCARD, {});
    const bookmarks = getJSON(KEYS.BOOKMARKS, []);

    // Total study days (distinct days in log)
    const studyDays = Object.keys(studyLog).length;
    const totalSessions = Object.values(studyLog).reduce((s, n) => s + n, 0);

    // Quiz stats
    const totalQuizzes = quizResults.length;
    const avgScore = totalQuizzes > 0
        ? (quizResults.reduce((s, r) => s + parseFloat(r.percentage), 0) / totalQuizzes).toFixed(1)
        : '0';
    const lastQuiz = quizResults[quizResults.length - 1];
    const bestQuiz = quizResults.reduce((best, r) =>
        (parseFloat(r.percentage) > parseFloat(best?.percentage || 0)) ? r : best, null);

    // Practice stats (from pyq.html practice mode)
    const practiceCorrect = practice.correct || 0;
    const practiceWrong = practice.wrong || 0;
    const practiceTotal = practiceCorrect + practiceWrong;
    const practiceAccuracy = practiceTotal > 0 ? ((practiceCorrect / practiceTotal) * 100).toFixed(1) : '0';

    // Flashcard stats
    const flashcardStats = flashcardState.stats || {};
    const reviewedCards = Object.entries(flashcardStats).filter(([id, s]) => s.reviews > 0).length;
    const totalFlashcards = 47; // from flashcards_data.js

    // Generate last 90 days heatmap data
    const heatmapData = generateHeatmapData(studyLog, 90);

    // Generate subject performance (mock based on quiz results + practice)
    const subjectPerf = generateSubjectPerformance(quizResults, practice);

            <div class="metric-card" style="--metric-grad: var(--grad-orange);">
                <div class="metric-icon">🔥</div>

                <div class="metric-label">Day Streak</div>
                <div class="metric-sub">${streak.lastDay ? 'Last: ' + streak.lastDay : 'Start today!'}</div>
            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-blue);">
                <div class="metric-icon">📅</div>
                <div class="metric-value">${studyDays}</div>

            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-purple);">
                <div class="metric-icon">🎯</div>
                <div class="metric-value">${totalQuizzes}</div>
                <div class="metric-label">Quizzes Taken</div>
                <div class="metric-sub">Avg: ${avgScore}%</div>
            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-cyan);">
                <div class="metric-icon">📝</div>
                <div class="metric-value">${(typeof window.getTotalStats === 'function' ? window.getTotalStats().totalAttempts : practiceTotal)}</div>
                <div class="metric-label">PYQs Practiced</div>
                <div class="metric-sub">Accuracy: ${(typeof window.getTotalStats === 'function' ? window.getTotalStats().accuracy : practiceAccuracy)}%</div>
            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-gold);">
                <div class="metric-icon">🎴</div>
                <div class="metric-value">${reviewedCards}/${totalFlashcards}</div>
                <div class="metric-label">Flashcards Reviewed</div>
                <div class="metric-sub">${flashcardPct}% complete</div>
            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-red);">
                <div class="metric-icon">🔖</div>
                <div class="metric-value">${bookmarks.length}</div>
                <div class="metric-label">Bookmarked Questions</div>
                <div class="metric-sub">For later review</div>
            </div>
        </div>

        <!-- Streak Heatmap -->
        <div class="streak-heatmap">
            <h3>📅 Study Activity (Last 90 Days)</h3>
            <p>Each square is a day. Darker = more activity. Click a square for details.</p>
            <div class="heatmap-grid">
                ${heatmapData.map(d => `
                    <div class="heatmap-cell level-${d.level}" title="${d.date}: ${d.count} session${d.count !== 1 ? 's' : ''}"></div>
                `).join('')}
            </div>
            <div class="heatmap-legend">
                Less

                <div class="cell" style="background: #c7d2fe;"></div>
                <div class="cell" style="background: #818cf8;"></div>
                <div class="cell" style="background: #4f46e5;"></div>
                <div class="cell" style="background: #3730a3;"></div>
                More

        </div>

        <!-- Subject Performance -->
        <div class="subject-performance">
            <h3>📚 Subject-wise Performance</h3>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:14px;">Real accuracy from your practice attempts. <strong>Red < 40%</strong>, <strong>Amber 40-60%</strong>, <strong>Green > 60%</strong>. Practice more weak areas!</p>
            ${subjectPerf.map(s => `

                    <div class="subj-name">${s.icon} ${s.label}</div>

                        <div class="fill" style="width: ${s.pct}%; background: ${s.color};"></div>
                    </div>

        </div>

        <!-- Recent Quiz History -->
        <div class="subject-performance">
            <h3>🎯 Recent Quiz Results</h3>
            ${quizResults.length === 0 ? `
                <div class="empty-state" style="padding:30px 10px;">
                    <div class="empty-icon">🎯</div>
                    <h3>No quizzes yet</h3>

                    <button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="location.href='./quiz.html'">🎯 Take a Quiz</button>

                            <th>Score</th>
                            <th>Correct</th>

                            <th>Skipped</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${quizResults.slice(-10).reverse().map(r => {
                            const date = new Date(r.date).toLocaleDateString();
                            const pctNum = parseFloat(r.percentage);
                            const pctColor = pctNum >= 80 ? '#065f46' : (pctNum >= 60 ? '#1e40af' : (pctNum >= 40 ? '#92400e' : '#991b1b'));
                            return `
                                <tr>
                                    <td>${date}</td>
                                    <td><strong>${r.score}/${(r.total * 1.5).toFixed(0)}</strong></td>
                                    <td style="color:#10b981;">✓ ${r.correct}</td>
                                    <td style="color:#ef4444;">✗ ${r.wrong}</td>
                                    <td>${r.unattempted}</td>
                                    <td style="color:${pctColor};font-weight:700;">${r.percentage}%</td>

        <div id="weakAreaSection"></div>

        <!-- Achievements & Gamification -->

            <h3 style="margin-bottom:6px;">🏆 Achievements & XP</h3>
            <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:14px;">Earn XP for every action. Unlock achievements. Climb the ranks.</p>
            <div id="achievementsContent"></div>
        </div>

        <!-- Quick Actions -->
        <div class="custom-playlist-section" style="margin-top:18px;background:linear-gradient(135deg, rgba(102,126,234,0.05), rgba(118,75,162,0.05));">
            <h3>🚀 Quick Actions</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;">
                <a href="./quiz.html" class="btn btn-ghost btn-sm">🎯 Take a Quiz</a>
                <a href="./pyq.html?view=practice" class="btn btn-ghost btn-sm">📝 Practice PYQs</a>
                <a href="./flashcards.html" class="btn btn-ghost btn-sm">🎴 Review Flashcards</a>
                <a href="./planner.html" class="btn btn-ghost btn-sm">📅 Plan Study</a>

                <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importProgressData(event)">
                <button class="btn btn-ghost btn-sm" onclick="if(confirm('Clear ALL progress data? This cannot be undone.')) { if (typeof window.clearAllProgress === 'function') window.clearAllProgress(); ['sohcse_quiz_results','sohcse_practice_state_v1','sohcse_flashcard_state_v1','sohcse_study_log_v1','sohcse_streak_v1','sohcse_question_bookmarks'].forEach(k=>localStorage.removeItem(k)); location.reload(); }">🗑 Reset All</button>
            </div>
        </div>
    `;
    // Render weak areas after dashboard renders
    setTimeout(renderWeakAreas, 300);
    // Render achievements
    setTimeout(renderAchievements, 350);
}

function renderAchievements() {
    if (typeof window.SOH_Game === 'undefined') return;
    const gameData = window.SOH_Game.getData();
    const level = window.SOH_Game.getLevelProgress(gameData.xp);
    const allAch = window.SOH_Game.getAllAchievements();
    const unlocked = allAch.filter(a => a.unlocked);
    const locked = allAch.filter(a => !a.unlocked);

    const section = document.getElementById('achievementsContent');
    if (!section) return;

    section.innerHTML = `
        <!-- Level / Rank card -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;flex-wrap:wrap;">
            <div class="metric-card" style="--metric-grad: var(--grad-brand);margin:0;">
                <div class="metric-icon" style="font-size:2rem;">${level.current.icon}</div>
                <div class="metric-value" style="font-size:1.2rem;">${level.current.name}</div>
                <div class="metric-label">Current Rank</div>
                <div class="metric-sub">${gameData.xp.toLocaleString()} total XP</div>
                <div class="level-progress-bar"><div class="level-fill" style="width:${level.pct}%;"></div></div>

                    ${level.next ? `${level.next.minXP - gameData.xp} XP to ${level.next.name}` : 'Maximum rank achieved!'}
                </div>
            </div>
            <div class="metric-card" style="--metric-grad: var(--grad-gold);margin:0;">
                <div class="metric-icon">🏆</div>
                <div class="metric-value">${unlocked.length}/${allAch.length}</div>
                <div class="metric-label">Achievements Unlocked</div>
                <div class="metric-sub">${Math.round((unlocked.length / allAch.length) * 100)}% complete</div>
            </div>
        </div>

        <!-- Rank Ladder -->
        <h4 style="margin:14px 0 8px;font-size:0.92rem;">Rank Ladder</h4>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;">
            ${window.SOH_Game.RANKS.map(r => {
                const isCurrent = r.name === level.current.name;
                const isUnlocked = gameData.xp >= r.minXP;
                return `
                    <div style="flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:8px;background:${isUnlocked ? 'linear-gradient(135deg, ' + r.color + '20, ' + r.color + '10)' : 'var(--bg-light)'};border:1px solid ${isUnlocked ? r.color : 'var(--border)'};${isCurrent ? 'box-shadow:0 0 0 2px ' + r.color + '40;' : ''}">

                        <div style="font-size:0.66rem;color:var(--text-muted);">${r.minXP.toLocaleString()} XP</div>

        </div>

        <!-- Unlocked achievements -->
        ${unlocked.length > 0 ? `
            <h4 style="margin:14px 0 8px;font-size:0.92rem;">✨ Unlocked (${unlocked.length})</h4>
            <div class="achievement-grid">
                ${unlocked.map(a => `
                    <div class="achievement-badge unlocked" title="${a.desc}">
                        <div class="ach-badge-icon">${a.icon}</div>
                        <div class="ach-badge-name">${a.name}</div>
                        <div style="font-size:0.66rem;color:#f59e0b;font-weight:600;margin-top:2px;">+${a.xp} XP</div>
                    </div>
                `).join('')}
            </div>
        ` : ''}

        <!-- Locked achievements (upcoming) -->
        ${locked.length > 0 ? `
            <h4 style="margin:14px 0 8px;font-size:0.92rem;color:var(--text-muted);">🔒 Locked (${locked.length})</h4>
            <div class="achievement-grid">
                ${locked.map(a => `
                    <div class="achievement-badge" title="${a.desc}" style="opacity:0.55;">
                        <div class="ach-badge-icon" style="filter:grayscale(1);">${a.icon}</div>
                        <div class="ach-badge-name">${a.name}</div>
                        <div style="font-size:0.66rem;color:var(--text-muted);margin-top:2px;">+${a.xp} XP</div>
                    </div>
                `).join('')}
            </div>
        ` : ''}
    `;
}

function exportProgressData() {
    if (typeof window.exportProgress !== 'function') { alert('Tracker not loaded'); return; }
    const json = window.exportProgress();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sohcse_progress_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    if (window.showToast) window.showToast('⬇ Progress exported', 'success');
}

function importProgressData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        if (confirm('Import progress data? This will overwrite current data.')) {
            if (typeof window.importProgress === 'function' && window.importProgress(e.target.result)) {
                if (window.showToast) window.showToast('✅ Progress imported', 'success');
                setTimeout(() => location.reload(), 1500);
            } else {
                alert('Import failed — invalid file format');
            }
        }
    };
    reader.readAsText(file);
}

function generateHeatmapData(studyLog, days) {
    const today = new Date();
    const data = [];
    for (let i = days - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().slice(0, 10);
        const count = studyLog[dateStr] || 0;
        let level = 0;
        if (count >= 5) level = 4;
        else if (count >= 3) level = 3;
        else if (count >= 2) level = 2;
        else if (count >= 1) level = 1;
        data.push({ date: dateStr, count, level });
    }
    return data;
}

function generateSubjectPerformance(quizResults, practice) {
    // Use real tracking data from tracker.js
    const realPerf = (typeof window.getSubjectPerformance === 'function') ? window.getSubjectPerformance() : {};
    
    const subjects = [
        { key: 'algorithms', label: 'Algorithms', icon: '⚡', color: 'var(--grad-blue)', pct: 0, total: 0, correct: 0 },
        { key: 'data-structures', label: 'Data Structures', icon: '🌳', color: 'var(--grad-purple)', pct: 0, total: 0, correct: 0 },

        { key: 'database-management-system', label: 'DBMS', icon: '🗄️', color: 'var(--grad-cyan)', pct: 0, total: 0, correct: 0 },
        { key: 'computer-networks', label: 'Computer Networks', icon: '🌐', color: 'var(--grad-blue)', pct: 0, total: 0, correct: 0 },

        { key: 'general-aptitude', label: 'General Aptitude', icon: '🧮', color: 'var(--grad-gold)', pct: 0, total: 0, correct: 0 }
    ];
    
    // Merge real data
    subjects.forEach(s => {
        const real = realPerf[s.key];
        if (real) {
            s.pct = real.accuracy;
            s.total = real.total;
            s.correct = real.correct;
        }
    });
    
    return subjects;
}
