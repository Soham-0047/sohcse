// ============ Helpers ============
function getJSON(key, def) {
    try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function setJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ============ Days until GATE 2027 ============
function daysUntilGate() {
    const gateDate = new Date('2027-02-13'); // GATE 2027 expected
    const now = new Date();
    return Math.max(0, Math.ceil((gateDate - now) / (1000 * 60 * 60 * 24)));
}

// ============ Smart Recommendations ============
function getRecommendations() {
    const recs = [];
    const now = Date.now();
    const perf = (typeof window.getSubjectPerformance === 'function') ? window.getSubjectPerformance() : {};
    const weakChapters = (typeof window.getWeakChapters === 'function') ? window.getWeakChapters(60) : [];
    const errors = (typeof window.getErrorNotebook === 'function') ? window.getErrorNotebook() : [];
    const errorDue = (typeof window.getErrorNotebookDue === 'function') ? window.getErrorNotebookDue() : [];

    // 1. If error notebook has due reviews → review them
    if (errorDue.length > 0) {
        recs.push({
            priority: 1,
            icon: '🔁',
            title: `Review ${errorDue.length} due card${errorDue.length !== 1 ? 's' : ''}`,
            desc: 'Spaced repetition time! Your error notebook has cards due for review.',
            cta: 'Review Now',
            href: './revision.html',
            color: 'var(--grad-red)',
        });
    }

    // 2. If weak chapters exist → drill them
    if (weakChapters.length > 0) {
        const top = weakChapters[0];
        const subjLabel = top.subject ? top.subject.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '';
        recs.push({
            priority: 2,
            icon: '🎯',
            title: `Drill weak area: ${subjLabel}`,
            desc: `Your accuracy is ${top.accuracy}%. Practice 10+ questions to improve.`,
            cta: 'Practice',
            href: `./pyq.html?subject=${top.subject}`,
            color: 'var(--grad-orange)',
        });
    }

    // 3. If no quizzes today → take one
    const today = new Date().toISOString().slice(0, 10);
    const quizzes = getJSON('sohcse_quiz_results', []);
    const quizzesToday = quizzes.filter(q => new Date(q.date).toISOString().slice(0, 10) === today).length;
    if (quizzesToday === 0) {
        recs.push({
            priority: 3,
            icon: '🎯',
            title: 'Daily Quiz',
            desc: "You haven't taken a quiz today. A quick 10-question quiz takes ~15 minutes.",
            cta: 'Take Quiz',
            href: './quiz.html',
            color: 'var(--grad-purple)',
        });
    }

    // 4. Mock test recommendation (if none in last 7 days)
    const lastMock = quizzes.filter(q => q.source === 'mocktest').slice(-1)[0];
    const weekAgo = now - 7 * 24 * 60 * 60 * 1000;
    if (!lastMock || new Date(lastMock.date).getTime() < weekAgo) {
        recs.push({
            priority: 4,
            icon: '⚔️',
            title: 'Weekly Mock Test',
            desc: 'Take a full 3-hour mock to simulate exam conditions and track readiness.',
            cta: 'Start Mock',
            href: './mocktest.html',
            color: 'var(--grad-blue)',
        });
    }

    // 5. Flashcard review
    const fcState = getJSON('sohcse_flashcard_state_v1', { stats: {} });
    const fcDue = Object.values(fcState.stats || {}).filter(s => s.nextReview && s.nextReview <= now).length;
    if (fcDue > 0) {
        recs.push({
            priority: 5,
            icon: '🎴',
            title: `${fcDue} flashcard${fcDue !== 1 ? 's' : ''} due`,
            desc: 'Quick spaced-repetition review to lock concepts into long-term memory.',
            cta: 'Review Cards',
            href: './flashcards.html',
            color: 'var(--grad-gold)',
        });
    }

    // 6. Study planner tasks for today
    const tasks = getJSON('sohcse_planner_tasks_v1', []);
    const tasksToday = tasks.filter(t => {
        if (t.completed) return false;
        if (!t.date) return true;
        return t.date === today;
    });
    if (tasksToday.length > 0) {
        recs.push({
            priority: 6,
            icon: '📋',
            title: `${tasksToday.length} task${tasksToday.length !== 1 ? 's' : ''} planned today`,
            desc: `"${tasksToday[0].title || 'Study session'}" — stay on track with your plan.`,
            cta: 'View Planner',
            href: './planner.html',
            color: 'var(--grad-cyan)',
        });
    }

    // 7. If no PYQs today → suggest practice
    if (typeof window.getTotalStats === 'function') {
        const trackerData = JSON.parse(localStorage.getItem('sohcse_progress_tracker') || '{}');
        const todayAttempts = (trackerData.attempts || []).filter(a => {
            const d = new Date(a.timestamp);
            return d.toISOString().slice(0, 10) === today;
        }).length;
        if (todayAttempts === 0) {
            recs.push({
                priority: 7,
                icon: '📝',
                title: 'Daily PYQ Practice',
                desc: "You haven't practiced any PYQs today. Even 10 questions keeps momentum.",
                cta: 'Practice PYQs',
                href: './pyq.html',
                color: 'var(--grad-blue)',
            });
        }
    }

    return recs.sort((a, b) => a.priority - b.priority).slice(0, 5);
}

// ============ Performance Predictor ============
function predictGateScore() {
    const perf = (typeof window.getSubjectPerformance === 'function') ? window.getSubjectPerformance() : {};
    const quizzes = getJSON('sohcse_quiz_results', []);

    // Subject weightage (GATE CSE 2027 pattern)
    const weights = {
        'algorithms': 12,
        'data-structures': 10.5,
        'discrete-mathematics': 11.5,
        'operating-systems': 9,
        'database-management-system': 8,
        'computer-networks': 8,
        'theory-of-computation': 9,
        'compiler-design': 6,
        'digital-logic': 5.5,
        'computer-organization': 9,
        'programming-languages': 8,
        'general-aptitude': 15,
    };

    let weightedScore = 0;
    let totalWeight = 0;
    let coverage = 0;
    let subjectCount = 0;

    for (const [subj, weight] of Object.entries(weights)) {
        const p = perf[subj];
        if (p && p.total >= 3) {
            // Convert accuracy (0-100) to GATE marks (out of 85, GA handled separately)
            // Adjust: penalty for low attempts, boost for high
            const confidence = Math.min(1, p.total / 20);
            const adjustedAccuracy = p.accuracy * (0.5 + 0.5 * confidence);
            weightedScore += (adjustedAccuracy / 100) * weight;
            totalWeight += weight;
            coverage++;
            if (p.accuracy >= 50) subjectCount++;
        }
    }

    // Add GA from quizzes if no direct GA data
    const gaPerf = perf['general-aptitude'];
    if ((!gaPerf || gaPerf.total < 3) && quizzes.length > 0) {
        const recentQuizzes = quizzes.slice(-5);
        const avgQuiz = recentQuizzes.reduce((s, q) => s + parseFloat(q.percentage), 0) / recentQuizzes.length;
        weightedScore += (avgQuiz / 100) * 15;
        totalWeight += 15;
    }

    if (totalWeight === 0) return null;

    const projectedScore = (weightedScore / totalWeight) * 100; // Out of 100
    // Convert to GATE score (out of 1000, assuming avg paper difficulty)
    const gateScore = Math.round(Math.max(0, (projectedScore - 25) * 13.33));

    // Rank estimation (calibrated to 2026 data: ~2.1 lakh appeared, 17% pass rate)
    let rankRange;
    if (projectedScore >= 85) rankRange = 'Top 10';
    else if (projectedScore >= 80) rankRange = 'Top 50';
    else if (projectedScore >= 75) rankRange = 'Top 200';
    else if (projectedScore >= 70) rankRange = 'Top 500-600';
    else if (projectedScore >= 60) rankRange = 'Top 1000-2000 (PSU/IIT eligible)';
    else if (projectedScore >= 50) rankRange = 'Top 3000-5000';
    else if (projectedScore >= 40) rankRange = 'Top 8000-12000';
    else if (projectedScore >= 30) rankRange = 'Top 15000-25000 (borderline qualifying)';
    else rankRange = 'Below qualifying — keep practicing!';

    // Cutoff prediction (based on verified 2026 data: Gen 30, OBC 27, SC/ST 20)
    const cutoffPrediction = {
        general: 30.0,
        obc: 27.0,
        sc_st: 20.0,
    };
    const willQualify = projectedScore >= cutoffPrediction.general;
    const qualifyStatus = willQualify
        ? `✅ Likely to qualify (projected ${projectedScore.toFixed(1)} ≥ General cutoff ${cutoffPrediction.general})`
        : `⚠ Need ${(cutoffPrediction.general - projectedScore).toFixed(1)} more marks to clear General cutoff (${cutoffPrediction.general})`;

    // Confidence based on coverage
    const confidencePct = (coverage / 12) * 100;

    return {
        projectedScore: projectedScore.toFixed(1),
        gateScore: Math.max(0, gateScore),
        rankRange,
        qualifyStatus,
        willQualify,
        cutoffs: cutoffPrediction,
        coverage: Math.round((coverage / 12) * 100),
        subjectsTracked: coverage,
        confidencePct: Math.round(confidencePct),
        subjectCount,
    };
}

function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    if (h < 21) return 'Good evening';
    return 'Burning the midnight oil';
}

function getGreetingIcon() {
    const h = new Date().getHours();
    if (h < 12) return '🌅';
    if (h < 17) return '☀️';
    if (h < 21) return '🌆';
    return '🌙';
}

    'Small steps every day lead to giant leaps.',
    "Consistency beats intensity. Show up daily.",
    'Every PYQ you practice is one step closer to GATE.',
    "Don't just learn — solve, fail, learn again.",

function getDailyQuote() {
    const day = new Date().getDate();

function renderActivityTimeline() {
    const trackerData = JSON.parse(localStorage.getItem('sohcse_progress_tracker') || '{}');
    const attempts = trackerData.attempts || [];
    const quizzes = trackerData.quizzes || [];
    const today = new Date().toISOString().slice(0, 10);

    // Last 7 days activity summary
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().slice(0, 10);
        const dayAttempts = attempts.filter(a => new Date(a.timestamp).toISOString().slice(0, 10) === dateStr);
        const dayQuizzes = quizzes.filter(q => new Date(q.timestamp).toISOString().slice(0, 10) === dateStr);
        const correct = dayAttempts.filter(a => a.correct).length;
        last7.push({
            date: dateStr,
            day: d.toLocaleDateString('en-US', { weekday: 'short' }),
            attempts: dayAttempts.length,
            correct,
            quizzes: dayQuizzes.length,
            isToday: dateStr === today,
        });
    }

    const maxAttempts = Math.max(...last7.map(d => d.attempts), 1);

    return `
        <div class="activity-timeline">
            ${last7.map(d => `
                <div class="timeline-day ${d.isToday ? 'today' : ''}">
                    <div class="timeline-day-label">${d.day}</div>
                    <div class="timeline-bar-container">
                        <div class="timeline-bar" style="height:${(d.attempts / maxAttempts) * 100}%;background:${d.attempts > 0 ? 'var(--grad-brand)' : 'var(--border-soft)'};"></div>
                    </div>
                    <div class="timeline-count">${d.attempts}</div>
                    ${d.quizzes > 0 ? `<div class="timeline-quiz-dot" title="${d.quizzes} quiz(zes)">🎯</div>` : ''}
                </div>
            `).join('')}
        </div>
        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;text-align:center;">Last 7 days PYQ activity • Bar shows relative activity</div>
    `;
}

// ============ Smart Insights ============
function renderSmartInsights() {
    const container = document.getElementById('smartInsights');
    if (!container) return;
    if (typeof window.SOH_Analytics === 'undefined') {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">Analytics module not loaded.</div>';
        return;
    }
    const insights = window.SOH_Analytics.generateInsights();
    if (insights.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
                <div style="font-size:1.8rem;margin-bottom:6px;">📊</div>
                <div style="font-size:0.88rem;">Practice more to unlock personalized insights!</div>
                <div style="font-size:0.76rem;margin-top:4px;">Need at least 10 attempts for analysis.</div>
            </div>
        `;
        return;
    }
    const colorMap = {
        urgent: 'var(--danger)',
        success: 'var(--correct)',
        warning: 'var(--warning)',
        info: 'var(--info)',
    };
    const bgMap = {
        urgent: 'rgba(239,68,68,0.08)',
        success: 'rgba(16,185,129,0.08)',
        warning: 'rgba(245,158,11,0.08)',
        info: 'rgba(59,130,246,0.08)',
    };
    container.innerHTML = insights.map(insight => `
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:${bgMap[insight.type]};border-left:3px solid ${colorMap[insight.type]};border-radius:8px;margin-bottom:8px;">
            <div style="font-size:1.3rem;flex-shrink:0;">${insight.icon}</div>
            <div style="flex:1;">
                <div style="font-weight:700;font-size:0.9rem;color:var(--text);margin-bottom:2px;">${insight.title}</div>
                <div style="font-size:0.82rem;color:var(--text-2);line-height:1.4;">${insight.desc}</div>
                ${insight.action && insight.href ? `<a href="${insight.href}" style="display:inline-block;margin-top:6px;font-size:0.78rem;font-weight:600;color:${colorMap[insight.type]};text-decoration:none;">${insight.action} →</a>` : ''}
            </div>
        </div>
    `).join('');
}

// ============ Streak Forecast ============
function renderStreakForecast() {
    const container = document.getElementById('streakForecast');
    if (!container) return;
    if (typeof window.SOH_Analytics === 'undefined') return;
    const forecast = window.SOH_Analytics.forecastStreak();

    const riskColors = {
        none: '#94a3b8',
        safe: '#10b981',
        warning: '#f59e0b',
        danger: '#ef4444',
        broken: '#6b7280',
    };
    const riskBg = {
        none: 'rgba(148,163,184,0.1)',
        safe: 'rgba(16,185,129,0.1)',
        warning: 'rgba(245,158,11,0.1)',
        danger: 'rgba(239,68,68,0.1)',
        broken: 'rgba(107,114,128,0.1)',
    };

    // Day-of-week mini bars
    const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const maxDay = Math.max(...forecast.weeklyActivity, 1);
    const dayBars = forecast.weeklyActivity.map((count, i) => {
        const height = (count / maxDay) * 100;
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
            <div style="font-size:0.6rem;color:var(--text-muted);">${dayNames[i]}</div>
            <div style="width:100%;height:40px;background:var(--bg-light);border-radius:3px;position:relative;overflow:hidden;">
                <div style="position:absolute;bottom:0;left:0;right:0;height:${height}%;background:${riskColors.safe};border-radius:3px;transition:height 0.4s var(--ease-out);"></div>
            </div>
        </div>`;
    }).join('');

    container.innerHTML = `
        <div style="background:${riskBg[forecast.riskLevel]};border-radius:8px;padding:12px;margin-bottom:12px;border-left:3px solid ${riskColors[forecast.riskLevel]};">
            <div style="font-size:0.82rem;font-weight:600;color:${riskColors[forecast.riskLevel]};margin-bottom:4px;">${forecast.riskMessage}</div>
            ${forecast.deadlineHours < 24 && forecast.riskLevel !== 'broken' && forecast.riskLevel !== 'none' ? `
                <div style="font-size:0.72rem;color:var(--text-muted);">⏱ ${forecast.deadlineHours}h ${60 - new Date().getMinutes()}m until deadline</div>
            ` : ''}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <div style="text-align:center;padding:10px;background:var(--bg-light);border-radius:8px;">
                <div style="font-size:1.6rem;font-weight:800;color:var(--primary);">${forecast.currentStreak}</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">Current Streak</div>
            </div>
            <div style="text-align:center;padding:10px;background:var(--bg-light);border-radius:8px;">
                <div style="font-size:1.6rem;font-weight:800;color:var(--primary);">${forecast.projected30DayStreak}</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">30-day Forecast</div>
            </div>
        </div>

        <div style="font-size:0.74rem;color:var(--text-muted);margin-bottom:6px;">📊 Activity by day of week</div>
        <div style="display:flex;gap:4px;height:50px;">${dayBars}</div>

        ${forecast.bestDayCount > 0 ? `
            <div style="font-size:0.74rem;color:var(--text-2);margin-top:8px;text-align:center;">
                🏆 Best day: <strong>${forecast.bestDay}</strong> (${forecast.bestDayCount} sessions)
            </div>
        ` : ''}
    `;
}

// ============ Study Time Patterns ============
function renderStudyTimePatterns() {
    const container = document.getElementById('studyTimePatterns');
    if (!container) return;
    if (typeof window.SOH_Analytics === 'undefined') return;
    const data = window.SOH_Analytics.studyTimeInsights();

    if (data.totalStudyMinutes === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
                <div style="font-size:1.5rem;margin-bottom:6px;">⏰</div>
                <div style="font-size:0.85rem;">Start practicing to see your study patterns!</div>
            </div>
        `;
        return;
    }

    const hours = Math.floor(data.totalStudyMinutes / 60);
    const mins = data.totalStudyMinutes % 60;
    const timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

    // Peak hours display
    const peakHoursHtml = data.peakHours.length > 0 ? data.peakHours.map(h => {
        const hour12 = h.hour === 0 ? '12a' : h.hour < 12 ? `${h.hour}a` : h.hour === 12 ? '12p' : `${h.hour - 12}p`;
        return `<span style="display:inline-block;padding:3px 8px;background:var(--bg-light);border-radius:6px;font-size:0.72rem;font-weight:600;margin:2px;">${hour12} (${h.count})</span>`;
    }).join('') : 'No data';

    // Time of day distribution
    const tod = data.timeOfDay;
    const todHtml = tod ? `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;">
            <div style="text-align:center;padding:8px 4px;background:rgba(251,191,36,0.1);border-radius:6px;">
                <div style="font-size:1.1rem;font-weight:800;color:#d97706;">${tod.morning.pct}%</div>
                <div style="font-size:0.62rem;color:var(--text-muted);">🌅 Morning</div>
            </div>
            <div style="text-align:center;padding:8px 4px;background:rgba(239,68,68,0.1);border-radius:6px;">
                <div style="font-size:1.1rem;font-weight:800;color:#dc2626;">${tod.afternoon.pct}%</div>
                <div style="font-size:0.62rem;color:var(--text-muted);">☀️ Afternoon</div>
            </div>
            <div style="text-align:center;padding:8px 4px;background:rgba(168,85,247,0.1);border-radius:6px;">
                <div style="font-size:1.1rem;font-weight:800;color:#7c3aed;">${tod.evening.pct}%</div>
                <div style="font-size:0.62rem;color:var(--text-muted);">🌆 Evening</div>
            </div>
            <div style="text-align:center;padding:8px 4px;background:rgba(59,130,246,0.1);border-radius:6px;">
                <div style="font-size:1.1rem;font-weight:800;color:#2563eb;">${tod.night.pct}%</div>
                <div style="font-size:0.62rem;color:var(--text-muted);">🌙 Night</div>
            </div>
        </div>
    ` : '';

    // Week-over-week change
    const wowColor = data.weekOverWeekChange >= 0 ? 'var(--correct)' : 'var(--danger)';
    const wowIcon = data.weekOverWeekChange >= 0 ? '📈' : '📉';

    container.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
            <div style="text-align:center;padding:10px 6px;background:var(--bg-light);border-radius:8px;">
                <div style="font-size:1.3rem;font-weight:800;color:var(--primary);">${timeStr}</div>
                <div style="font-size:0.66rem;color:var(--text-muted);">Total Time</div>
            </div>
            <div style="text-align:center;padding:10px 6px;background:var(--bg-light);border-radius:8px;">
                <div style="font-size:1.3rem;font-weight:800;color:var(--primary);">${data.avgSessionMinutes}m</div>
                <div style="font-size:0.66rem;color:var(--text-muted);">Avg Session</div>
            </div>
            <div style="text-align:center;padding:10px 6px;background:var(--bg-light);border-radius:8px;">
                <div style="font-size:1.3rem;font-weight:800;color:${wowColor};">${wowIcon} ${Math.abs(data.weekOverWeekChange)}%</div>
                <div style="font-size:0.66rem;color:var(--text-muted);">vs Last Week</div>
            </div>
        </div>

        <div style="font-size:0.74rem;color:var(--text-muted);margin-bottom:4px;">⏰ Peak study hours</div>
        <div>${peakHoursHtml}</div>

        ${todHtml}
    `;
}

// ============ Performance Trajectory ============
function renderPerformanceTrajectory() {
    const container = document.getElementById('performanceTrajectory');
    if (!container) return;
    if (typeof window.SOH_Analytics === 'undefined') return;
    const trajectory = window.SOH_Analytics.performanceTrajectory();

    if (!trajectory) {
        container.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
                <div style="font-size:1.5rem;margin-bottom:6px;">📈</div>
                <div style="font-size:0.85rem;">Practice at least 10 questions to see your trajectory!</div>
            </div>
        `;
        return;
    }

    // Render 5-bucket accuracy chart (mini bar chart)
    const maxAcc = Math.max(...trajectory.buckets.map(b => b.accuracy), 100);
    const barsHtml = trajectory.buckets.map((b, i) => {
        const height = (b.accuracy / 100) * 100;
        const color = b.accuracy >= 70 ? '#10b981' : (b.accuracy >= 50 ? '#f59e0b' : '#ef4444');
        return `
            <div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;">
                <div style="font-size:0.7rem;font-weight:700;color:${color};">${b.accuracy}%</div>
                <div style="width:100%;max-width:50px;height:80px;background:var(--bg-light);border-radius:6px;position:relative;overflow:hidden;">
                    <div style="position:absolute;bottom:0;left:0;right:0;height:${height}%;background:${color};border-radius:6px;transition:height 0.6s var(--ease-out);"></div>
                </div>
                <div style="font-size:0.6rem;color:var(--text-muted);">Phase ${i + 1}</div>
            </div>
        `;
    }).join('');

    // Subject trajectories
    const subjTraj = Object.entries(trajectory.subjectTrajectories)
        .sort((a, b) => b[1].change - a[1].change)
        .slice(0, 5);
    const subjHtml = subjTraj.length > 0 ? subjTraj.map(([subj, t]) => {
        const label = subj.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const color = t.change > 5 ? 'var(--correct)' : (t.change < -5 ? 'var(--danger)' : 'var(--text-muted)');
        const arrow = t.change > 5 ? '↑' : (t.change < -5 ? '↓' : '→');
        return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-soft);">
                <div style="font-size:0.82rem;color:var(--text);">${label}</div>
                <div style="font-size:0.78rem;color:${color};font-weight:600;">
                    ${t.firstAcc}% → ${t.secondAcc}% <span style="margin-left:4px;">${arrow} ${Math.abs(t.change)}</span>
                </div>
            </div>
        `;
    }).join('') : '<div style="font-size:0.82rem;color:var(--text-muted);text-align:center;padding:10px;">Not enough data per subject yet.</div>';

    container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
            <div>
                <div style="font-size:1.4rem;font-weight:800;color:${trajectory.trendColor};">${trajectory.trendLabel}</div>
                <div style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">Started at ${trajectory.startingAccuracy}% • Now at ${trajectory.currentAccuracy}% • Change: ${trajectory.trend >= 0 ? '+' : ''}${trajectory.trend} pts</div>
            </div>
        </div>

        <div style="display:flex;gap:6px;align-items:flex-end;margin-bottom:18px;">${barsHtml}</div>

        <div style="font-size:0.86rem;font-weight:700;margin-bottom:8px;">📊 Subject-wise Trajectory (top 5)</div>
        ${subjHtml}
    `;
}
