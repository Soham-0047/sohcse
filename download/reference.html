<h3>CPU Scheduling Algorithms</h3>
<p><strong>Scheduling</strong> decides which process runs when multiple processes compete for CPU. Goal: maximize CPU utilization, throughput, fairness; minimize waiting time, turnaround time, response time.</p>
<h4>Key Formulas</h4>
<ul>
<li><strong>Turnaround Time (TAT)</strong> = Waiting Time + Burst Time = Completion Time - Arrival Time</li>
<li><strong>Waiting Time</strong> = TAT - Burst Time</li>
<li><strong>Response Time</strong> = First CPU allocation - Arrival Time</li>
<li><strong>Average Waiting Time</strong> = Σ(Waiting Time of each process) / n</li>
</ul>
<h4>Scheduling Algorithms</h4>
<ol>
<li><strong>FCFS (First Come First Serve):</strong> Non-preemptive, convoy effect (short processes wait behind long one)</li>
<li><strong>SJF (Shortest Job First):</strong> Non-preemptive, <em>optimal</em> for minimum average waiting time. Starves long processes.</li>
<li><strong>SRTF (Shortest Remaining Time First):</strong> Preemptive version of SJF</li>
<li><strong>Priority Scheduling:</strong> Lower number = higher priority. Starvation → solved by <strong>aging</strong> (increase priority over time)</li>
<li><strong>Round Robin (RR):</strong> Time quantum $q$. Each process gets $q$ units, then pre-empted. No starvation. Performance depends on $q$: large $q$ → FCFS, small $q$ → too many context switches</li>
<li><strong>Multilevel Queue:</strong> Separate queues for foreground (RR), background (FCFS)</li>
<li><strong>Multilevel Feedback Queue:</strong> Processes can move between queues based on CPU usage</li>
</ol>
<div class="info-box"><strong>🎯 GATE Tip:</strong> SJF is provably optimal for minimizing average waiting time. For RR, optimal quantum ≈ 80% of processes complete within it. Always draw Gantt chart for numericals.</div>
` },
            { title: 'Deadlocks', content: `
<h3>Deadlocks</h3>
<p><strong>Deadlock</strong> = set of blocked processes each holding a resource and waiting for another's resource, forming a circular wait.</p>
<h4>Four Necessary Conditions (Coffman Conditions)</h4>
<ol>
<li><strong>Mutual Exclusion:</strong> Resource held in non-shareable mode</li>
<li><strong>Hold and Wait:</strong> Process holds resources while waiting for others</li>
<li><strong>No Preemption:</strong> Resources released only voluntarily</li>
<li><strong>Circular Wait:</strong> Cycle in resource allocation graph</li>
</ol>
<p><em>All four must hold simultaneously for deadlock. Breaking any one prevents deadlock.</em></p>
<h4>Deadlock Handling Strategies</h4>
<ol>
<li><strong>Prevention:</strong> Break one of the 4 conditions (e.g., ordered resource acquisition breaks circular wait)</li>
<li><strong>Avoidance:</strong> Banker's Algorithm — only grant resources if system stays in <em>safe state</em></li>
<li><strong>Detection & Recovery:</strong> Allow deadlock, detect via RAG cycle, recover by killing processes</li>
<li><strong>Ignore:</strong> Ostrich approach (used by Unix/Linux)</li>
</ol>
<h4>Banker's Algorithm</h4>
<ul>
<li><strong>Need</strong> = Max - Allocation</li>
<li><strong>Safe state:</strong> ∃ sequence where each process can complete with Available + finished processes' resources</li>
<li><strong>Resource Allocation Graph (RAG):</strong> If single instance per resource type, cycle ⟹ deadlock. If multiple instances, cycle ≠ deadlock (necessary but not sufficient)</li>
<li><strong>Time complexity:</strong> $O(m \\times n^2)$ where m = resource types, n = processes</li>
</ul>
<div class="info-box"><strong>🎯 GATE Tip:</strong> RAG cycle with single-instance resources ⟹ deadlock. With multiple instances, cycle is necessary but not sufficient. Banker's algorithm is the most asked topic.</div>
` },

<h3>Memory Management</h3>
<h4>Paging</h4>
<ul>
<li>Logical address = Page Number | Offset</li>
<li>Page table maps page number → frame number</li>
<li><strong>Effective Access Time (EAT):</strong> $EAT = (1-p) \\times m + p \\times (m + m)$ where p = page fault rate, m = memory access time</li>
<li><strong>With TLB:</strong> $EAT = h \\times (t + m) + (1-h) \\times (t + 2m)$ where h = TLB hit ratio, t = TLB access time</li>
</ul>
<h4>Page Replacement Algorithms</h4>
<ol>
<li><strong>FIFO:</strong> Replace oldest page. Suffers from <strong>Belady's Anomaly</strong> (more frames → more faults!)</li>
<li><strong>LRU (Least Recently Used):</strong> Replace page not used for longest. No Belady's anomaly. Stack algorithm.</li>
<li><strong>Optimal:</strong> Replace page not used for longest in <em>future</em>. Best possible, but not implementable (needs future knowledge)</li>
</ol>
<h4>Thrashing</h4>
<p>Process spends more time paging than executing. Caused by too many processes competing for frames.</p>
<div class="info-box"><strong>🎯 GATE Tip:</strong> Belady's anomaly occurs ONLY in FIFO, NOT in LRU or Optimal (these are "stack algorithms"). LRU approximates Optimal in practice.</div>
` },

<ul>

let currentSubject = null;

function renderSubjectTabs() {
    const tabs = document.getElementById('subjectTabs');
    tabs.innerHTML = Object.entries(REFERENCE).map(([key, ref]) =>
        `<button class="tab-premium ${key === currentSubject ? 'active' : ''}" onclick="selectSubject('${key}')">${ref.label} <span style="font-size:0.68rem;color:var(--text-muted);">${ref.weight}</span></button>`
    ).join('');
}

function selectSubject(key) {
    currentSubject = key;
    renderSubjectTabs();
    renderContent('');
}

function renderContent(filter) {
    const container = document.getElementById('refContent');
    if (!currentSubject) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div><h3>Select a subject</h3><p>Choose any subject above to see in-depth notes, formulas, and worked examples.</p></div>';
        return;
    }
    const ref = REFERENCE[currentSubject];
    let topics = ref.topics;
    if (filter) {
        const q = filter.toLowerCase();
        topics = topics.filter(t =>
            t.title.toLowerCase().includes(q) ||
            t.content.toLowerCase().includes(q)
        );
    }
    if (topics.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>No matches</h3><p>No content found for "' + filter + '". Try a different search.</p></div>';
        return;
    }
    container.innerHTML = topics.map((t, i) => `
        <div class="section-card" style="margin-bottom:18px;">
            <h2 style="font-size:1.2rem;margin-bottom:12px;color:var(--text);">${i+1}. ${t.title}</h2>
            <div class="q-content" style="font-size:0.92rem;line-height:1.8;color:var(--text);">${t.content}</div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                <a href="./pyq.html?subject=${currentSubject}" class="btn btn-primary btn-sm">📝 Practice PYQs</a>
                <a href="./learn.html" class="btn btn-ghost btn-sm">📖 More Notes</a>
                <a href="./flashcards.html" class="btn btn-ghost btn-sm">🎴 Flashcards</a>
            </div>
        </div>
    `).join('');
    // Render KaTeX
    if (typeof renderMathInElement === 'function') {
        document.querySelectorAll('.q-content').forEach(el => {
            try { renderMathInElement(el, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false }); } catch{}
        });
    } else {
        setTimeout(() => renderContent(filter), 200);
    }
}

function filterContent(val) {
    if (!currentSubject) return;
    renderContent(val);
}

// Init
renderSubjectTabs();
// Auto-select first subject
selectSubject(Object.keys(REFERENCE)[0]);
</script>
